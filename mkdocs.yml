site_name: 机器人世界模型教程
site_description: 机器人世界模型渐进式教程。从张量、编码与表征学习出发，逐步走向 Attention、生成模型、VLM、VLA、世界模型与机器人闭环行动。
site_author: TODO
site_url: https://qi-robotics.github.io/robot-world-model-tutorial/
repo_url: https://github.com/qi-robotics/robot-world-model-tutorial
repo_name: qi-robotics/robot-world-model-tutorial
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 TODO Authors · 许可证待补充
docs_dir: docs
site_dir: site
use_directory_urls: true
dev_addr: 127.0.0.1:8000

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/logo.png
  favicon: assets/images/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  homepage: /
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qi-robotics/robot-world-model-tutorial
      name: GitHub 仓库

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/components.css

extra_javascript:
  - assets/javascripts/header-title.js
  - assets/javascripts/chapter-nav.js?v=3
  - assets/javascripts/mathjax.js
  - assets/javascripts/visualizations.js
  - assets/javascripts/tutorial.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页:
      - index.md
      - 学习路线: roadmap.md
      - 环境准备: setup.md
      - 关于本教程: about.md
  - 基础篇:
      - 基础篇概览: basics/index.md
      - 单元一 · 现实与学习:
          - 01 观察世界: basics/01-robot-view-of-the-world.md
          - 02 神经网络学习: basics/02-how-neural-networks-learn.md
      - 单元二 · 观测与动作接口:
          - 03 视觉编码: basics/03-vision-encoding.md
          - 04 视觉表征学习: basics/04-visual-representation-learning.md
          - 05 语言编码: basics/05-language-encoding.md
          - 06 三维感知与坐标变换: basics/06-spatial-geometry.md
          - 07 本体、触觉与动作: basics/07-robot-state-and-action.md
  - 进阶篇:
      - 进阶篇概览: intermediate/index.md
      - 单元一 · 历史与上下文:
          - 08 时间与记忆:
              - 08 导读: intermediate/08-time-and-memory.md
              - 08-1 时间序列样本: intermediate/08-1-temporal-sequences.md
              - 08-2 循环神经网络 RNN: intermediate/08-2-rnn.md
              - 08-3 长短期记忆 LSTM: intermediate/08-3-lstm.md
              - 08-4 GRU 与模型比较: intermediate/08-4-gru-and-comparison.md
          - 09 Attention 与 Transformer:
              - 09 导读: intermediate/09-attention-and-transformer.md
              - 09-1 Attention 基本计算: intermediate/09-1-attention-calculation.md
              - 09-2 时间位置与 mask: intermediate/09-2-position-and-masks.md
              - 09-3 注意力接口与多头: intermediate/09-3-attention-interfaces.md
              - 09-4 Transformer 架构: intermediate/09-4-transformer-architecture.md
          - 10 多模态 Context Model:
              - 10 导读: intermediate/10-multimodal-context-model.md
              - 10-1 时间对齐与 token: intermediate/10-1-time-alignment-and-tokens.md
              - 10-2 多模态 Context 的构建: intermediate/10-2-multimodal-fusion.md
              - 10-3 Context Model 的训练与验证: intermediate/10-3-context-training-and-validation.md
      - 单元二 · 生成式动作:
          - 11 从示范到动作序列:
              - 11 导读: intermediate/11-demonstrations-to-action-sequences.md
              - 11-1 示范轨迹与动作标签: intermediate/11-1-demonstrations-and-action-labels.md
              - 11-2 行为克隆与动作块预测: intermediate/11-2-behavior-cloning.md
              - 11-3 动作块的执行与反馈: intermediate/11-3-action-chunk-execution.md
              - 11-4 多种合理动作: intermediate/11-4-multimodal-actions.md
          - 12 Diffusion 与 Flow Matching:
              - 12 导读: intermediate/12-diffusion-and-flow-matching.md
              - 12-1 Diffusion 的训练: intermediate/12-1-diffusion-training.md
              - 12-2 Diffusion 的生成: intermediate/12-2-diffusion-sampling.md
              - 12-3 Flow Matching: intermediate/12-3-flow-matching.md
              - 12-4 生成动作的约束与评价: intermediate/12-4-action-generation-in-robotics.md
          - 13 生成式 Action Model:
              - 13 导读: intermediate/13-generative-action-model.md
              - 13-1 Action Model 的组成与动作专家: intermediate/13-1-action-experts.md
              - 13-2 统一动作接口与滚动执行: intermediate/13-2-action-interface-and-execution.md

site_name: 机器人世界模型教程
site_description: 机器人世界模型渐进式教程。从张量、编码与表征学习出发，逐步走向 Attention、生成模型、VLM、VLA、世界模型与机器人闭环行动。
site_author: TODO
site_url: https://qi-robotics.github.io/robot-world-model-tutorial/
repo_url: https://github.com/qi-robotics/robot-world-model-tutorial
repo_name: qi-robotics/robot-world-model-tutorial
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 TODO Authors · 许可证待补充
docs_dir: docs
site_dir: site
use_directory_urls: true
dev_addr: 127.0.0.1:8000

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/logo.png
  favicon: assets/images/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  homepage: /
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qi-robotics/robot-world-model-tutorial
      name: GitHub 仓库

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/components.css

extra_javascript:
  - assets/javascripts/header-title.js
  - assets/javascripts/chapter-nav.js?v=3
  - assets/javascripts/mathjax.js
  - assets/javascripts/visualizations.js
  - assets/javascripts/tutorial.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true


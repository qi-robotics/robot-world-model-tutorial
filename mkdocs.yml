  - 高级篇:
      - 高级篇概览: advanced/index.md
      - 单元一 · 从交互到未来预测:
          - 14 动作条件世界模型: advanced/14-action-conditioned-world-model.md
          - 15 视觉未来的预测: advanced/15-visual-world-models.md
      - 单元二 · 从未来到机器人动作:
          - 16 级联式世界动作模型: advanced/16-cascaded-world-action-model.md
          - 17 联合式世界动作模型: advanced/17-joint-world-action-model.md
  - 实践项目:
      - projects/index.md
      - 表征学习小项目: projects/representation-learning.md
      - 多模态对齐小项目: projects/multimodal-alignment.md
      - 动作条件预测: projects/action-conditioned-prediction.md
      - Mini-VLA: projects/mini-vla.md
      - 迷你世界模型系统: projects/final-world-model-system.md
  - 附录:
      - 数学基础: appendices/math-foundations.md
      - PyTorch 基础: appendices/pytorch-foundations.md
      - 论文阅读模板: appendices/paper-reading-template.md
      - 实验记录模板: appendices/experiment-template.md
      - 术语表: glossary.md
      - 参考文献: references.md

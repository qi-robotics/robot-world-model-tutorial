site_name: 从编码到行动
site_description: 机器人世界模型渐进式教程。从张量、编码与表征学习出发，逐步走向 Attention、生成模型、VLM、VLA、世界模型与机器人闭环行动。
site_author: TODO
site_url: https://qi-robotics.github.io/robot-world-model-tutorial/
repo_url: https://github.com/qi-robotics/robot-world-model-tutorial
repo_name: qi-robotics/robot-world-model-tutorial
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 TODO Authors · 许可证待补充
docs_dir: docs
site_dir: site
use_directory_urls: true
dev_addr: 127.0.0.1:8000

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/logo.png
  favicon: assets/images/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  homepage: /
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qi-robotics/robot-world-model-tutorial
      name: GitHub 仓库

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/components.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/visualizations.js
  - assets/javascripts/tutorial.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页:
      - index.md
      - 学习路线: roadmap.md
      - 环境准备: setup.md
      - 关于本教程: about.md
  - 基础篇:
      - 基础篇概览: basics/index.md
      - 单元一 · 现实与学习:
          - 01 观察世界: basics/01-robot-view-of-the-world.md
          - 02 神经网络学习: basics/02-how-neural-networks-learn.md
      - 单元二 · 观测与动作接口:
          - 03 视觉编码: basics/03-vision-encoding.md
          - 04 视觉表征学习: basics/04-visual-representation-learning.md
          - 05 语言编码: basics/05-language-encoding.md
          - 06 三维感知与坐标变换: basics/06-spatial-geometry.md
          - 07 本体、触觉与动作: basics/07-robot-state-and-action.md
  - 进阶篇:
      - 进阶篇概览: intermediate/index.md
      - 单元一 · 序列与上下文:
          - 12 时间与记忆: intermediate/temporal-modeling.md
          - 13 Attention: intermediate/attention.md
          - 14 Transformer: intermediate/transformer.md
          - 15 多模态 Context: intermediate/multimodal-fusion.md
      - 单元二 · 动作生成:
          - 16 动作表示: advanced/action-representation.md
          - 17 自回归生成: intermediate/autoregressive-models.md
          - 18 Diffusion: intermediate/diffusion.md
      - 单元三 · 预测未来:
          - 22 视频预测: intermediate/video-prediction.md
          - 23 潜空间动力学: intermediate/latent-dynamics.md
      - 单元四 · 选择动作:
          - 26 模型控制: intermediate/model-based-control.md
          - 27 规划与策略: advanced/planning-and-policy.md
  - 高级篇:
      - 高级篇概览: advanced/index.md
      - 单元一 · 语言驱动行动:
          - 28 视觉语言模型: advanced/vlm.md
          - 29 Visual Grounding: advanced/visual-grounding.md
          - 30 视觉语言动作: advanced/vla.md
      - 单元二 · 通用机器人:
          - 33 泛化与迁移: advanced/generalization.md
      - 单元三 · 世界模型:
          - 35 世界模型: advanced/world-model.md
          - 36.1 RSSM 与 Dreamer: advanced/rssm-and-dreamer.md
          - 36.2 V-JEPA: advanced/v-jepa.md
          - 37 VLA-JEPA: advanced/vla-jepa.md
      - 单元四 · 真实机器人:
          - 43 Sim-to-Real: advanced/sim-to-real.md
          - 45 安全与恢复: advanced/safety-and-recovery.md
  - 实践项目:
      - projects/index.md
      - 表征学习小项目: projects/representation-learning.md
      - 多模态对齐小项目: projects/multimodal-alignment.md
      - 动作条件预测: projects/action-conditioned-prediction.md
      - Mini-VLA: projects/mini-vla.md
      - 迷你世界模型系统: projects/final-world-model-system.md
  - 附录:

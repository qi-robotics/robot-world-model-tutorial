<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">Context Model 的训练数据流</title>
  <desc id="desc">可用观测与目标形成 Context，动作模型产生预测。示范动作只进入损失比较，误差反向更新可训练模块。</desc>
  <defs>
    <style>
      .heading{font:700 24px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .label{font:700 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .text{font:15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
      .input{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .module{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .result{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .target{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrowhead)}
      .back{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#backhead)}
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="9" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L0 7L9 3.5z" fill="#475569"/></marker>
    <marker id="backhead" markerWidth="9" markerHeight="7" refX="9" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L0 7L9 3.5z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1120" height="390" fill="#fff"/>
  <text x="560" y="40" text-anchor="middle" class="heading">示范动作是核对答案，不是 Context 的输入</text>

  <rect x="36" y="90" width="208" height="96" rx="9" class="input"/>
  <text x="140" y="121" text-anchor="middle" class="label">当前可用输入</text>
  <text x="140" y="150" text-anchor="middle" class="text">观测 · 过去动作 · 指令</text>
  <text x="140" y="172" text-anchor="middle" class="small">全部不晚于决策时刻</text>

  <rect x="303" y="90" width="195" height="96" rx="9" class="module"/>
  <text x="400" y="121" text-anchor="middle" class="label">Context Model</text>
  <text x="400" y="150" text-anchor="middle" class="text">形成任务条件表示</text>
  <text x="400" y="172" text-anchor="middle" class="small">编码、融合与输出</text>

  <rect x="558" y="90" width="195" height="96" rx="9" class="module"/>
  <text x="655" y="121" text-anchor="middle" class="label">动作模型</text>
  <text x="655" y="151" text-anchor="middle" class="text">依据 Context 预测</text>

  <rect x="813" y="90" width="255" height="96" rx="9" class="result"/>
  <text x="940" y="121" text-anchor="middle" class="label">预测动作</text>
  <text x="940" y="152" text-anchor="middle" class="text">模型当前给出的结果</text>
  <path d="M244 138H297" class="arrow"/>
  <path d="M498 138H552" class="arrow"/>
  <path d="M753 138H807" class="arrow"/>

  <rect x="558" y="252" width="195" height="65" rx="9" class="target"/>
  <text x="655" y="278" text-anchor="middle" class="label">真实示范动作</text>
  <text x="655" y="300" text-anchor="middle" class="small">只作为训练答案</text>
  <rect x="813" y="245" width="255" height="78" rx="9" class="result"/>
  <text x="940" y="274" text-anchor="middle" class="label">比较误差</text>
  <text x="940" y="301" text-anchor="middle" class="small">预测与示范有多大差别</text>
  <path d="M940 186V239" class="arrow"/>
  <path d="M753 284H807" class="arrow"/>

  <path d="M940 323V345H400V192" class="back"/>
  <path d="M525 345V205H655V192" class="back"/>
  <text x="535" y="364" text-anchor="middle" class="small">虚线：误差更新参与训练的参数</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">三种多模态融合布局</title><desc id="desc">对比单流自注意力、分组交叉注意力和 latent bottleneck。</desc>
  <defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 18px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.token{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.query{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.latent{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs>
  <rect width="1120" height="520" fill="#fff"/><text x="560" y="42" text-anchor="middle" class="title">融合布局决定信息怎样交换，也决定计算成本</text>
  <rect x="35" y="78" width="330" height="390" rx="18" class="panel"/><text x="200" y="116" text-anchor="middle" class="head">单流 Self-Attention</text>
  <g class="token"><rect x="75" y="155" width="62" height="46" rx="8"/><rect x="151" y="155" width="62" height="46" rx="8"/><rect x="227" y="155" width="62" height="46" rx="8"/><rect x="75" y="225" width="62" height="46" rx="8"/><rect x="151" y="225" width="62" height="46" rx="8"/><rect x="227" y="225" width="62" height="46" rx="8"/></g>
  <path d="M106 201L182 225M182 201L258 225M258 201L106 225M106 271L258 155" class="arrow"/><text x="200" y="325" text-anchor="middle" class="text">全部 token 直接交互</text><text x="200" y="356" text-anchor="middle" class="small">交互充分，成本约 N²</text><text x="200" y="417" text-anchor="middle" class="small">适合 token 数量可控的输入</text>
  <rect x="395" y="78" width="330" height="390" rx="18" class="panel"/><text x="560" y="116" text-anchor="middle" class="head">分组 Cross-Attention</text>
  <rect x="438" y="152" width="110" height="58" rx="10" class="query"/><text x="493" y="187" text-anchor="middle" class="text">语言 / 查询</text><rect x="585" y="140" width="98" height="42" rx="8" class="token"/><rect x="585" y="194" width="98" height="42" rx="8" class="token"/><rect x="585" y="248" width="98" height="42" rx="8" class="token"/><text x="634" y="166" text-anchor="middle" class="small">视觉</text><text x="634" y="220" text-anchor="middle" class="small">状态</text><text x="634" y="274" text-anchor="middle" class="small">历史</text><path d="M548 180L579 162M548 180L579 215M548 180L579 269" class="arrow"/>
  <text x="560" y="325" text-anchor="middle" class="text">查询定向读取分组记忆</text><text x="560" y="356" text-anchor="middle" class="small">路径清晰，可复用各自编码器</text><text x="560" y="417" text-anchor="middle" class="small">适合预训练模态编码器</text>
  <rect x="755" y="78" width="330" height="390" rx="18" class="panel"/><text x="920" y="116" text-anchor="middle" class="head">Latent bottleneck</text>
  <g class="token"><rect x="790" y="145" width="58" height="40" rx="7"/><rect x="790" y="197" width="58" height="40" rx="7"/><rect x="790" y="249" width="58" height="40" rx="7"/></g><text x="819" y="306" text-anchor="middle" class="small">大量输入 N</text>
  <g class="latent"><rect x="900" y="170" width="62" height="46" rx="8"/><rect x="900" y="232" width="62" height="46" rx="8"/></g><text x="931" y="306" text-anchor="middle" class="small">少量 latent L</text><path d="M848 165L894 190M848 217L894 194M848 269L894 252" class="arrow"/>
  <rect x="1000" y="190" width="55" height="58" rx="10" class="query"/><text x="1027" y="214" text-anchor="middle" class="small">输</text><text x="1027" y="235" text-anchor="middle" class="small">出</text><path d="M962 224L994 219" class="arrow"/>
  <text x="920" y="356" text-anchor="middle" class="small">成本约 NL + L²</text><text x="920" y="417" text-anchor="middle" class="small">适合多相机和长输入</text>
</svg>

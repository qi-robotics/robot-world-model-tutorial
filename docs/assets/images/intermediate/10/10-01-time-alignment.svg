<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">多速率传感器时间对齐</title><desc id="desc">相机、本体和触觉以不同频率采样，并对齐到四个策略决策时刻。</desc>
  <defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.line{stroke:#94a3b8;stroke-width:2}.decision{stroke:#ea580c;stroke-width:2;stroke-dasharray:7 6}.cam{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.prop{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.touch{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2}.box{fill:#fff7ed;stroke:#ea580c;stroke-width:2}</style></defs>
  <rect width="1080" height="520" fill="#fff"/><text x="540" y="42" text-anchor="middle" class="title">先按时间戳对齐，再进入 Context Model</text>
  <text x="78" y="118" class="head">相机 20 Hz</text><line x1="190" y1="112" x2="1010" y2="112" class="line"/>
  <text x="78" y="208" class="head">本体 100 Hz</text><line x1="190" y1="202" x2="1010" y2="202" class="line"/>
  <text x="78" y="298" class="head">触觉 200 Hz</text><line x1="190" y1="292" x2="1010" y2="292" class="line"/>
  <g class="cam"><circle cx="225" cy="112" r="10"/><circle cx="390" cy="112" r="10"/><circle cx="555" cy="112" r="10"/><circle cx="720" cy="112" r="10"/><circle cx="885" cy="112" r="10"/></g>
  <g class="prop"><circle cx="210" cy="202" r="6"/><circle cx="260" cy="202" r="6"/><circle cx="310" cy="202" r="6"/><circle cx="360" cy="202" r="6"/><circle cx="410" cy="202" r="6"/><circle cx="460" cy="202" r="6"/><circle cx="510" cy="202" r="6"/><circle cx="560" cy="202" r="6"/><circle cx="610" cy="202" r="6"/><circle cx="660" cy="202" r="6"/><circle cx="710" cy="202" r="6"/><circle cx="760" cy="202" r="6"/><circle cx="810" cy="202" r="6"/><circle cx="860" cy="202" r="6"/><circle cx="910" cy="202" r="6"/><circle cx="960" cy="202" r="6"/></g>
  <g class="touch"><circle cx="205" cy="292" r="4"/><circle cx="235" cy="292" r="4"/><circle cx="265" cy="292" r="4"/><circle cx="295" cy="292" r="4"/><circle cx="325" cy="292" r="4"/><circle cx="355" cy="292" r="4"/><circle cx="385" cy="292" r="4"/><circle cx="415" cy="292" r="4"/><circle cx="445" cy="292" r="4"/><circle cx="475" cy="292" r="4"/><circle cx="505" cy="292" r="4"/><circle cx="535" cy="292" r="4"/><circle cx="565" cy="292" r="4"/><circle cx="595" cy="292" r="4"/><circle cx="625" cy="292" r="4"/><circle cx="655" cy="292" r="4"/><circle cx="685" cy="292" r="4"/><circle cx="715" cy="292" r="4"/><circle cx="745" cy="292" r="4"/><circle cx="775" cy="292" r="4"/><circle cx="805" cy="292" r="4"/><circle cx="835" cy="292" r="4"/><circle cx="865" cy="292" r="4"/><circle cx="895" cy="292" r="4"/><circle cx="925" cy="292" r="4"/><circle cx="955" cy="292" r="4"/></g>
  <g><line x1="300" y1="78" x2="300" y2="340" class="decision"/><line x1="500" y1="78" x2="500" y2="340" class="decision"/><line x1="700" y1="78" x2="700" y2="340" class="decision"/><line x1="900" y1="78" x2="900" y2="340" class="decision"/></g>
  <text x="600" y="365" text-anchor="middle" class="small">橙色虚线：策略产生动作的决策时刻</text>
  <rect x="205" y="398" width="210" height="74" rx="12" class="box"/><text x="310" y="426" text-anchor="middle" class="head">相机：最近过去帧</text><text x="310" y="451" text-anchor="middle" class="small">同时记录数据年龄</text>
  <rect x="435" y="398" width="210" height="74" rx="12" class="box"/><text x="540" y="426" text-anchor="middle" class="head">本体：插值或最近值</text><text x="540" y="451" text-anchor="middle" class="small">连续量与离散量分开</text>
  <rect x="665" y="398" width="210" height="74" rx="12" class="box"/><text x="770" y="426" text-anchor="middle" class="head">触觉：窗口内聚合</text><text x="770" y="451" text-anchor="middle" class="small">保留短暂峰值与接触</text>
</svg>

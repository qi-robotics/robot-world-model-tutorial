<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="570" viewBox="0 0 1140 570" role="img" aria-labelledby="title desc">
  <title id="title">行为克隆中的动作块预测与有效位损失</title>
  <desc id="desc">当前 Context 进入动作模型，输出三个时刻各七维的动作块。下方只取一个关节的三个时间位置，末尾无效标签不参与损失。</desc>
  <defs>
    <style>
      .heading{font:700 25px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .section{font:700 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
      .input{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .model{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .pred{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .valid{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .invalid{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}
      .loss{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}
      .line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrowhead)}
      .bracket{fill:none;stroke:#475569;stroke-width:2.5}
      .back{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#backhead)}
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="9" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L0 7L9 3.5z" fill="#475569"/></marker>
    <marker id="backhead" markerWidth="9" markerHeight="7" refX="9" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L0 7L9 3.5z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1140" height="570" fill="#fff"/>
  <text x="570" y="40" text-anchor="middle" class="heading">由当前 Context 预测动作块，只用有答案的位置计算误差</text>

  <rect x="35" y="86" width="228" height="112" rx="9" class="input"/>
  <text x="149" y="122" text-anchor="middle" class="section">Context Cₜ</text>
  <text x="149" y="152" text-anchor="middle" class="body">观测 · 目标 · 过去动作</text>
  <text x="149" y="178" text-anchor="middle" class="small">不含未来示范动作</text>

  <rect x="320" y="86" width="228" height="112" rx="9" class="model"/>
  <text x="434" y="122" text-anchor="middle" class="section">Action Model</text>
  <text x="434" y="152" text-anchor="middle" class="body">一次产生完整动作块</text>
  <text x="434" y="178" text-anchor="middle" class="small">参数随误差更新</text>
  <path d="M263 142H314" class="line"/>
  <path d="M548 142H601" class="line"/>

  <rect x="608" y="76" width="497" height="132" rx="9" class="pred"/>
  <text x="856" y="104" text-anchor="middle" class="section">预测动作块：3 步 × 每步 7 维</text>
  <rect x="630" y="121" width="140" height="59" rx="7" fill="#fff" stroke="#ea580c"/>
  <rect x="794" y="121" width="140" height="59" rx="7" fill="#fff" stroke="#ea580c"/>
  <rect x="958" y="121" width="140" height="59" rx="7" fill="#fff" stroke="#ea580c"/>
  <text x="700" y="146" text-anchor="middle" class="body">时刻 t</text>
  <text x="700" y="168" text-anchor="middle" class="small">7 个数</text>
  <text x="864" y="146" text-anchor="middle" class="body">t+1</text>
  <text x="864" y="168" text-anchor="middle" class="small">7 个数</text>
  <text x="1028" y="146" text-anchor="middle" class="body">t+2</text>
  <text x="1028" y="168" text-anchor="middle" class="small">7 个数</text>

  <line x1="35" y1="236" x2="1105" y2="236" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="272" class="section">放大看：一个关节的三步标签，最后一步没有真实答案</text>
  <text x="243" y="320" text-anchor="middle" class="section">时刻 t</text>
  <text x="420" y="320" text-anchor="middle" class="section">t+1</text>
  <text x="597" y="320" text-anchor="middle" class="section">t+2</text>
  <text x="75" y="366" class="body">模型预测</text>
  <text x="75" y="423" class="body">示范标签</text>
  <text x="75" y="480" class="body">有效位</text>
  <g class="valid">
    <rect x="174" y="333" width="137" height="43" rx="6"/>
    <rect x="351" y="333" width="137" height="43" rx="6"/>
    <rect x="174" y="390" width="137" height="43" rx="6"/>
    <rect x="351" y="390" width="137" height="43" rx="6"/>
    <rect x="174" y="447" width="137" height="43" rx="6"/>
    <rect x="351" y="447" width="137" height="43" rx="6"/>
  </g>
  <g class="invalid">
    <rect x="528" y="333" width="137" height="43" rx="6"/>
    <rect x="528" y="390" width="137" height="43" rx="6"/>
    <rect x="528" y="447" width="137" height="43" rx="6"/>
  </g>
  <g text-anchor="middle" class="body">
    <text x="243" y="362">0.1</text><text x="420" y="362">0.2</text><text x="597" y="362">0.9</text>
    <text x="243" y="419">0.0</text><text x="420" y="419">0.4</text><text x="597" y="419">无效</text>
    <text x="243" y="476">1</text><text x="420" y="476">1</text><text x="597" y="476">0</text>
  </g>
  <rect x="755" y="334" width="350" height="156" rx="9" class="loss"/>
  <text x="930" y="369" text-anchor="middle" class="section">仅计算有效位置的均方误差</text>
  <text x="930" y="407" text-anchor="middle" class="body">(0.01 + 0.04) ÷ 2 = 0.025</text>
  <text x="930" y="441" text-anchor="middle" class="small">灰色的 t+2 不参与分子和分母</text>
  <path d="M174 497V505H488V497" class="bracket"/>
  <path d="M331 505V515H720V412H749" class="line"/>
  <path d="M930 490V537H700V225H434V204" class="back"/>
  <text x="683" y="557" text-anchor="middle" class="small">误差反向更新模型参数</text>
</svg>

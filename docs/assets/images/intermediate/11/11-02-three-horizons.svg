<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">观察预测执行三种时间范围</title><desc id="desc">观察范围位于当前时刻之前，预测范围位于当前时刻之后，执行范围是预测范围的前缀。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.obs{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.pred{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.exec{fill:#fed7aa;stroke:#ea580c;stroke-width:2.5}.line{stroke:#64748b;stroke-width:2}.now{stroke:#dc2626;stroke-width:3;stroke-dasharray:8 6}</style></defs><rect width="1080" height="500" fill="#fff"/><text x="540" y="42" text-anchor="middle" class="title">预测多远与实际执行多远是两个参数</text><line x1="110" y1="250" x2="995" y2="250" class="line"/><line x1="520" y1="95" x2="520" y2="410" class="now"/><text x="520" y="82" text-anchor="middle" class="head">当前时刻 t</text><rect x="160" y="135" width="360" height="70" rx="12" class="obs"/><text x="340" y="165" text-anchor="middle" class="head">Observation horizon Hₒ</text><text x="340" y="188" text-anchor="middle" class="small">决定 Context 能读取多长历史</text><rect x="520" y="285" width="430" height="70" rx="12" class="pred"/><text x="735" y="315" text-anchor="middle" class="head">Prediction horizon Hₚ</text><text x="735" y="338" text-anchor="middle" class="small">模型一次生成完整 Action Chunk</text><rect x="520" y="375" width="165" height="70" rx="12" class="exec"/><text x="602" y="405" text-anchor="middle" class="head">Execution Hₑ</text><text x="602" y="428" text-anchor="middle" class="small">只执行前缀</text><g class="text" text-anchor="middle"><text x="160" y="278">t−Hₒ</text><text x="520" y="278">t</text><text x="685" y="278">重新观察</text><text x="950" y="278">t+Hₚ</text></g></svg>

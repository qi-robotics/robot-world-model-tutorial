<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">多峰动作的均值问题</title><desc id="desc">两组示范分别从障碍上方和下方绕行，均值轨迹穿过中央障碍。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.upper{fill:none;stroke:#2563eb;stroke-width:5}.lower{fill:none;stroke:#7c3aed;stroke-width:5}.mean{fill:none;stroke:#dc2626;stroke-width:4;stroke-dasharray:10 7}.obstacle{fill:#cbd5e1;stroke:#475569;stroke-width:2}.point{fill:#16a34a}</style></defs><rect width="1040" height="520" fill="#fff"/><text x="520" y="42" text-anchor="middle" class="title">动作的条件均值不一定是一条真实示范</text><circle cx="115" cy="270" r="13" class="point"/><text x="115" y="305" text-anchor="middle" class="head">起点</text><circle cx="925" cy="270" r="13" class="point"/><text x="925" y="305" text-anchor="middle" class="head">目标</text><rect x="445" y="185" width="150" height="170" rx="20" class="obstacle"/><text x="520" y="276" text-anchor="middle" class="head">障碍</text><path d="M128 270C290 80 740 80 912 270" class="upper"/><path d="M128 270C290 460 740 460 912 270" class="lower"/><path d="M128 270C340 270 700 270 912 270" class="mean"/><text x="520" y="105" text-anchor="middle" class="head" fill="#2563eb">模式 1：上绕</text><text x="520" y="445" text-anchor="middle" class="head" fill="#7c3aed">模式 2：下绕</text><text x="520" y="155" text-anchor="middle" class="small">两种轨迹都成功</text><rect x="330" y="472" width="380" height="34" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="520" y="495" text-anchor="middle" class="text">红色虚线：MSE 单值回归的平均轨迹会碰撞</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc"><title id="title">示范轨迹切窗</title><desc id="desc">从完整轨迹中以当前时刻为锚点切出观察历史与未来动作块。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.obs{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.now{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}.act{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.mask{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1100" height="490" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">一个锚点同时定义历史输入和未来动作标签</text><text x="60" y="110" class="head">完整示范轨迹</text><line x1="205" y1="103" x2="1035" y2="103" stroke="#94a3b8" stroke-width="3"/><g class="obs"><circle cx="235" cy="103" r="12"/><circle cx="335" cy="103" r="12"/><circle cx="435" cy="103" r="12"/><circle cx="535" cy="103" r="12"/></g><circle cx="635" cy="103" r="15" class="now"/><g class="act"><circle cx="735" cy="103" r="12"/><circle cx="835" cy="103" r="12"/><circle cx="935" cy="103" r="12"/></g><g class="small" text-anchor="middle"><text x="235" y="137">t−4</text><text x="335" y="137">t−3</text><text x="435" y="137">t−2</text><text x="535" y="137">t−1</text><text x="635" y="137">t</text><text x="735" y="137">t+1</text><text x="835" y="137">t+2</text><text x="935" y="137">t+3</text></g><rect x="185" y="190" width="470" height="95" rx="14" class="obs"/><text x="420" y="225" text-anchor="middle" class="head">Observation horizon</text><text x="420" y="253" text-anchor="middle" class="text">观测、历史动作与目标 → Context Cₜ</text><rect x="635" y="190" width="330" height="95" rx="14" class="act"/><text x="800" y="225" text-anchor="middle" class="head">Prediction horizon</text><text x="800" y="253" text-anchor="middle" class="text">动作标签 Aₜ = [aₜ … aₜ₊H₋₁]</text><path d="M635 150V184" class="arrow"/><rect x="185" y="340" width="780" height="82" rx="14" class="mask"/><text x="575" y="372" text-anchor="middle" class="head">先按整条轨迹 / 场景划分 train 与 validation，再在各自内部切窗</text><text x="575" y="399" text-anchor="middle" class="small">轨迹边界处分别使用 history mask 与 action loss mask</text></svg>

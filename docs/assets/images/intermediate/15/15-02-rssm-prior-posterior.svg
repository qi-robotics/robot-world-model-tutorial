<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">RSSM prior 与 posterior</title><desc id="desc">确定性状态根据上一潜状态和动作更新，prior 从确定性状态产生，posterior 额外读取当前观测。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.input{fill:#f8fafc;stroke:#64748b;stroke-width:2}.hidden{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.prior{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.post{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.decode{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#a)}.kl{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#r)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#dc2626"/></marker></defs><rect width="1100" height="520" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">RSSM 用 posterior 学习观测修正，用 prior 支持未来想象</text><rect x="55" y="155" width="135" height="70" rx="12" class="input"/><text x="122" y="184" text-anchor="middle" class="head">zₜ₋₁ 与 aₜ₋₁</text><text x="122" y="208" text-anchor="middle" class="small">上一潜状态和动作</text><rect x="245" y="155" width="170" height="70" rx="12" class="hidden"/><text x="330" y="184" text-anchor="middle" class="head">recurrent state hₜ</text><text x="330" y="208" text-anchor="middle" class="small">确定性历史更新</text><path d="M190 190H237" class="arrow"/><rect x="485" y="95" width="190" height="75" rx="13" class="prior"/><text x="580" y="126" text-anchor="middle" class="head">prior p(zₜ | hₜ)</text><text x="580" y="151" text-anchor="middle" class="small">只读取历史</text><path d="M415 180C450 170 455 135 477 132" class="arrow"/><rect x="485" y="235" width="190" height="75" rx="13" class="post"/><text x="580" y="266" text-anchor="middle" class="head">posterior q(zₜ | hₜ,oₜ)</text><text x="580" y="291" text-anchor="middle" class="small">使用当前观测修正</text><path d="M415 200C450 210 455 270 477 272" class="arrow"/><rect x="265" y="300" width="130" height="60" rx="11" class="input"/><text x="330" y="336" text-anchor="middle" class="head">观测 oₜ</text><path d="M395 330C435 330 445 285 477 276" class="arrow"/><path d="M580 228V178" class="kl"/><text x="700" y="208" class="text">KL 让 prior 接近 posterior</text><rect x="795" y="145" width="235" height="120" rx="15" class="decode"/><text x="912" y="181" text-anchor="middle" class="head">从 (hₜ, zₜ) 解码</text><text x="912" y="211" text-anchor="middle" class="small">observation / reward</text><text x="912" y="237" text-anchor="middle" class="small">continue / task events</text><path d="M675 272C730 285 745 225 787 215" class="arrow"/><rect x="280" y="415" width="540" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="550" y="450" text-anchor="middle" class="head">训练使用 posterior；无观测想象只能从 prior 采样或取代表值</text></svg>

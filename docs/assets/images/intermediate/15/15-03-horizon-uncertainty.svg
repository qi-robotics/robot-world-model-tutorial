<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">预测误差与不确定性随 horizon 增长</title><desc id="desc">预测均值逐渐偏离真实轨迹，置信带随想象长度变宽，并在阈值后停止用于规划。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.axis{stroke:#64748b;stroke-width:2}.truth{fill:none;stroke:#172033;stroke-width:4}.mean{fill:none;stroke:#2563eb;stroke-width:3}.band{fill:#bfdbfe;opacity:.55}.limit{stroke:#dc2626;stroke-width:2.5;stroke-dasharray:8 6}</style></defs><rect width="1080" height="520" fill="#fff"/><text x="540" y="42" text-anchor="middle" class="title">未来越远，误差与可信区间都应被显式检查</text><line x1="105" y1="425" x2="1000" y2="425" class="axis"/><line x1="105" y1="100" x2="105" y2="425" class="axis"/><path d="M105 350C250 300 350 220 500 245C650 270 760 175 1000 145L1000 370C760 330 650 315 500 285C350 250 250 325 105 370Z" class="band"/><path d="M105 360C250 310 350 230 500 260C650 295 760 250 1000 270" class="mean"/><path d="M105 358C250 308 350 225 500 245C650 255 760 190 1000 155" class="truth"/><line x1="760" y1="90" x2="760" y2="425" class="limit"/><text x="760" y="78" text-anchor="middle" class="head" fill="#dc2626">最大可信 horizon</text><text x="330" y="150" class="text">真实未来</text><text x="645" y="335" class="text" fill="#2563eb">预测均值</text><text x="850" y="355" class="text">预测区间逐渐变宽</text><text x="550" y="470" text-anchor="middle" class="head">Rollout horizon</text><text x="45" y="270" text-anchor="middle" class="head" transform="rotate(-90 45 270)">预测量</text><rect x="170" y="110" width="280" height="54" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="310" y="143" text-anchor="middle" class="small">短 horizon：误差小，区间较窄</text><rect x="790" y="385" width="210" height="54" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="895" y="418" text-anchor="middle" class="small">阈值后停止或增加风险代价</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">观测更新与无观测想象</title><desc id="desc">真实历史阶段使用观测修正 belief，未来想象阶段只使用 prior 与候选动作推进。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.obs{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.belief{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.prior{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.future{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#a)}.divide{stroke:#dc2626;stroke-width:2.5;stroke-dasharray:8 6}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1100" height="500" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">真实观测修正 belief，未来想象只能依赖 prior</text><text x="215" y="95" text-anchor="middle" class="head">Observe：有真实证据</text><g class="obs"><rect x="65" y="135" width="120" height="65" rx="11"/><rect x="235" y="135" width="120" height="65" rx="11"/></g><g class="text" text-anchor="middle"><text x="125" y="174">观测 oₜ₋₁</text><text x="295" y="174">观测 oₜ</text></g><g class="belief"><rect x="65" y="275" width="120" height="65" rx="11"/><rect x="235" y="275" width="120" height="65" rx="11"/></g><g class="text" text-anchor="middle"><text x="125" y="314">belief bₜ₋₁</text><text x="295" y="314">posterior bₜ</text></g><path d="M125 200V267M185 307H227M295 200V267" class="arrow"/><line x1="430" y1="88" x2="430" y2="405" class="divide"/><text x="765" y="95" text-anchor="middle" class="head">Imagine：没有未来观测</text><g class="prior"><rect x="500" y="275" width="140" height="65" rx="11"/><rect x="700" y="275" width="140" height="65" rx="11"/></g><g class="future"><rect x="900" y="275" width="140" height="65" rx="11"/></g><g class="text" text-anchor="middle"><text x="570" y="314">prior b̂ₜ₊₁</text><text x="770" y="314">prior b̂ₜ₊₂</text><text x="970" y="314">未来 b̂ₜ₊H</text></g><g class="obs"><rect x="500" y="145" width="140" height="60" rx="11"/><rect x="700" y="145" width="140" height="60" rx="11"/><rect x="900" y="145" width="140" height="60" rx="11"/></g><g class="text" text-anchor="middle"><text x="570" y="181">候选动作 aₜ</text><text x="770" y="181">候选动作 aₜ₊₁</text><text x="970" y="181">候选动作 …</text></g><path d="M355 307H492M640 307H692M840 307H892M570 205V267M770 205V267M970 205V267" class="arrow"/><text x="550" y="440" text-anchor="middle" class="small">想象开始前的 posterior belief 是真实历史与候选未来之间的连接点</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Padding mask 与 causal mask</title><desc id="desc">左侧排除补齐列，右侧使用下三角允许区域阻止每个查询读取未来位置。</desc>
  <defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 18px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.ok{fill:#dbeafe;stroke:#2563eb;stroke-width:1}.focus{fill:#93c5fd;stroke:#2563eb;stroke-width:1}.block{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1}.frame{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}</style></defs><rect width="1040" height="560" fill="#fff"/><text x="520" y="42" text-anchor="middle" class="title">mask 明确规定哪些信息可以进入 Attention</text>
  <g transform="translate(45,85)"><rect width="440" height="410" rx="18" class="frame"/><text x="220" y="38" text-anchor="middle" class="head">Padding mask：排除不存在的位置</text><text x="220" y="65" text-anchor="middle" class="small">最后两列是补齐 token，所有 Query 都不能读取</text>
    <g transform="translate(75,105)"><text x="-22" y="30" class="small">q₁</text><text x="-22" y="82" class="small">q₂</text><text x="-22" y="134" class="small">q₃</text><text x="-22" y="186" class="small">q₄</text><text x="20" y="-12" class="small">k₁</text><text x="72" y="-12" class="small">k₂</text><text x="124" y="-12" class="small">k₃</text><text x="176" y="-12" class="small">k₄</text><text x="228" y="-12" class="small">pad</text><text x="280" y="-12" class="small">pad</text>
    <g class="ok"><rect x="0" y="0" width="50" height="50"/><rect x="52" y="0" width="50" height="50"/><rect x="104" y="0" width="50" height="50"/><rect x="156" y="0" width="50" height="50"/><rect x="0" y="52" width="50" height="50"/><rect x="52" y="52" width="50" height="50"/><rect x="104" y="52" width="50" height="50"/><rect x="156" y="52" width="50" height="50"/><rect x="0" y="104" width="50" height="50"/><rect x="52" y="104" width="50" height="50"/><rect x="104" y="104" width="50" height="50"/><rect x="156" y="104" width="50" height="50"/><rect x="0" y="156" width="50" height="50"/><rect x="52" y="156" width="50" height="50"/><rect x="104" y="156" width="50" height="50"/><rect x="156" y="156" width="50" height="50"/></g><g class="block"><rect x="208" y="0" width="50" height="50"/><rect x="260" y="0" width="50" height="50"/><rect x="208" y="52" width="50" height="50"/><rect x="260" y="52" width="50" height="50"/><rect x="208" y="104" width="50" height="50"/><rect x="260" y="104" width="50" height="50"/><rect x="208" y="156" width="50" height="50"/><rect x="260" y="156" width="50" height="50"/></g><text x="234" y="235" text-anchor="middle" class="small">被遮挡</text><text x="286" y="235" text-anchor="middle" class="small">被遮挡</text></g>
  </g>
  <g transform="translate(555,85)"><rect width="440" height="410" rx="18" class="frame"/><text x="220" y="38" text-anchor="middle" class="head">Causal mask：阻止读取未来</text><text x="220" y="65" text-anchor="middle" class="small">第 t 行只允许读取不晚于 t 的 Key</text>
    <g transform="translate(105,105)"><text x="-22" y="30" class="small">q₁</text><text x="-22" y="82" class="small">q₂</text><text x="-22" y="134" class="small">q₃</text><text x="-22" y="186" class="small">q₄</text><text x="20" y="-12" class="small">k₁</text><text x="72" y="-12" class="small">k₂</text><text x="124" y="-12" class="small">k₃</text><text x="176" y="-12" class="small">k₄</text>
    <rect x="0" y="0" width="50" height="50" class="focus"/><rect x="52" y="0" width="50" height="50" class="block"/><rect x="104" y="0" width="50" height="50" class="block"/><rect x="156" y="0" width="50" height="50" class="block"/><rect x="0" y="52" width="50" height="50" class="ok"/><rect x="52" y="52" width="50" height="50" class="focus"/><rect x="104" y="52" width="50" height="50" class="block"/><rect x="156" y="52" width="50" height="50" class="block"/><rect x="0" y="104" width="50" height="50" class="ok"/><rect x="52" y="104" width="50" height="50" class="ok"/><rect x="104" y="104" width="50" height="50" class="focus"/><rect x="156" y="104" width="50" height="50" class="block"/><rect x="0" y="156" width="50" height="50" class="ok"/><rect x="52" y="156" width="50" height="50" class="ok"/><rect x="104" y="156" width="50" height="50" class="ok"/><rect x="156" y="156" width="50" height="50" class="focus"/>
    <text x="104" y="245" text-anchor="middle" class="small">允许区域</text><text x="235" y="82" class="small">未来位置</text><text x="235" y="104" class="small">被遮挡</text></g>
  </g><rect x="386" y="520" width="20" height="20" class="ok"/><text x="414" y="536" class="small">允许读取</text><rect x="520" y="520" width="20" height="20" class="block"/><text x="548" y="536" class="small">禁止读取</text>
</svg>

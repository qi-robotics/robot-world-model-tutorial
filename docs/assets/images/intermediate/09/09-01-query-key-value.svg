<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Query、Key 与 Value 的读取过程</title><desc id="desc">当前查询与四个历史 Key 计算相似度，得到不同权重，再从相应 Value 中加权读取上下文。</desc>
  <defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 18px sans-serif;fill:#1e293b}.text{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.query{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}.key{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.value{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.context{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.5}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.weight{fill:none;stroke:#7c3aed;marker-end:url(#p)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7c3aed"/></marker></defs>
  <rect width="1080" height="560" fill="#fff"/><text x="540" y="42" text-anchor="middle" class="title">当前查询决定从哪些历史位置读取信息</text>
  <rect x="45" y="218" width="190" height="90" rx="16" class="query"/><text x="140" y="253" text-anchor="middle" class="head">Query q</text><text x="140" y="281" text-anchor="middle" class="text">是否应该闭合夹爪？</text>
  <g transform="translate(330,82)"><rect width="170" height="62" rx="12" class="key"/><text x="85" y="28" text-anchor="middle" class="head">Key k₁</text><text x="85" y="50" text-anchor="middle" class="small">看见目标</text><rect x="215" width="190" height="62" rx="12" class="value"/><text x="310" y="28" text-anchor="middle" class="head">Value v₁</text><text x="310" y="50" text-anchor="middle" class="small">目标位置与外观</text></g>
  <g transform="translate(330,172)"><rect width="170" height="62" rx="12" class="key"/><text x="85" y="28" text-anchor="middle" class="head">Key k₂</text><text x="85" y="50" text-anchor="middle" class="small">末端接近</text><rect x="215" width="190" height="62" rx="12" class="value"/><text x="310" y="28" text-anchor="middle" class="head">Value v₂</text><text x="310" y="50" text-anchor="middle" class="small">距离仍然较远</text></g>
  <g transform="translate(330,262)"><rect width="170" height="62" rx="12" class="key"/><text x="85" y="28" text-anchor="middle" class="head">Key k₃</text><text x="85" y="50" text-anchor="middle" class="small">发生接触</text><rect x="215" width="190" height="62" rx="12" class="value"/><text x="310" y="28" text-anchor="middle" class="head">Value v₃</text><text x="310" y="50" text-anchor="middle" class="small">触觉稳定</text></g>
  <g transform="translate(330,352)"><rect width="170" height="62" rx="12" class="key"/><text x="85" y="28" text-anchor="middle" class="head">Key k₄</text><text x="85" y="50" text-anchor="middle" class="small">背景变化</text><rect x="215" width="190" height="62" rx="12" class="value"/><text x="310" y="28" text-anchor="middle" class="head">Value v₄</text><text x="310" y="50" text-anchor="middle" class="small">无关光照变化</text></g>
  <path d="M235 250C270 220 285 115 322 113" class="arrow"/><path d="M235 255C275 245 290 203 322 203" class="arrow"/><path d="M235 270C275 285 290 293 322 293" class="arrow"/><path d="M235 278C275 330 290 383 322 383" class="arrow"/>
  <text x="525" y="458" text-anchor="middle" class="small">Softmax 权重：0.08　0.17　0.68　0.07</text>
  <path d="M735 113C800 135 820 225 850 250" class="weight" stroke-width="1.5"/><path d="M735 203C800 210 820 240 850 255" class="weight" stroke-width="2.2"/><path d="M735 293C800 290 820 275 850 270" class="weight" stroke-width="6"/><path d="M735 383C800 350 820 295 850 280" class="weight" stroke-width="1.3"/>
  <rect x="865" y="220" width="175" height="100" rx="16" class="context"/><text x="953" y="255" text-anchor="middle" class="head">读取结果 c</text><text x="953" y="282" text-anchor="middle" class="text">重点保留接触信息</text><text x="953" y="305" text-anchor="middle" class="small">Value 的加权组合</text>
  <text x="540" y="525" text-anchor="middle" class="text">Key 决定怎样被匹配，Value 决定匹配后提供什么内容</text>
</svg>

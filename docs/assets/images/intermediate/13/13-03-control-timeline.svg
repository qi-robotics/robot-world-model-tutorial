<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">RTC 中旧动作与新动作块的控制时间线</title>
  <desc id="desc">时刻一取新观测，推理持续三个控制周期。旧块执行到时刻三；新块前三步对应已确定的旧动作，从时刻四开始接管。</desc>
  <defs><style>.title{font:700 23px sans-serif;fill:#172033}.rowlabel{font:700 16px sans-serif;fill:#243247}.axis{font:15px sans-serif;fill:#475569}.celltext{font:14px sans-serif;fill:#243247}.note{font:14px sans-serif;fill:#475569}.old{fill:#eef2f5;stroke:#64748b;stroke-width:1.5}.fixed{fill:#fff1d9;stroke:#ce7b15;stroke-width:1.5}.guided{fill:#e1edfb;stroke:#4377aa;stroke-width:1.5}.new{fill:#def2e3;stroke:#338253;stroke-width:1.5}.bar{fill:#e1edfb;stroke:#4377aa;stroke-width:1.5}.switch{stroke:#bc4b26;stroke-width:2;stroke-dasharray:6 5}</style></defs>
  <rect width="1120" height="500" fill="white"/>
  <text x="560" y="39" text-anchor="middle" class="title">推理占用三个周期时，旧块继续执行，新块从时刻 4 接管</text>
  <text x="32" y="87" class="rowlabel">控制时刻</text>
  <text x="222" y="87" text-anchor="middle" class="axis">0</text>
  <text x="320" y="87" text-anchor="middle" class="axis">1</text>
  <text x="418" y="87" text-anchor="middle" class="axis">2</text>
  <text x="516" y="87" text-anchor="middle" class="axis">3</text>
  <text x="614" y="87" text-anchor="middle" class="axis">4</text>
  <text x="712" y="87" text-anchor="middle" class="axis">5</text>
  <text x="810" y="87" text-anchor="middle" class="axis">6</text>
  <text x="908" y="87" text-anchor="middle" class="axis">7</text>
  <text x="1006" y="87" text-anchor="middle" class="axis">8</text>
  <text x="32" y="155" class="rowlabel">旧动作块</text>
  <rect x="180" y="125" width="84" height="46" rx="5" class="old"/><text x="222" y="153" text-anchor="middle" class="celltext">旧 0</text>
  <rect x="278" y="125" width="84" height="46" rx="5" class="old"/><text x="320" y="153" text-anchor="middle" class="celltext">旧 1</text>
  <rect x="376" y="125" width="84" height="46" rx="5" class="old"/><text x="418" y="153" text-anchor="middle" class="celltext">旧 2</text>
  <rect x="474" y="125" width="84" height="46" rx="5" class="old"/><text x="516" y="153" text-anchor="middle" class="celltext">旧 3</text>
  <rect x="572" y="125" width="84" height="46" rx="5" class="old"/><text x="614" y="153" text-anchor="middle" class="celltext">旧 4</text>
  <rect x="670" y="125" width="84" height="46" rx="5" class="old"/><text x="712" y="153" text-anchor="middle" class="celltext">旧 5</text>
  <rect x="768" y="125" width="84" height="46" rx="5" class="old"/><text x="810" y="153" text-anchor="middle" class="celltext">旧 6</text>
  <rect x="866" y="125" width="84" height="46" rx="5" class="old"/><text x="908" y="153" text-anchor="middle" class="celltext">旧 7</text>
  <text x="32" y="225" class="rowlabel">后台推理</text>
  <rect x="278" y="193" width="280" height="46" rx="5" class="bar"/><text x="418" y="221" text-anchor="middle" class="celltext">使用时刻 1 的新观测</text>
  <text x="32" y="301" class="rowlabel">新动作块</text>
  <rect x="278" y="271" width="84" height="46" rx="5" class="fixed"/><text x="320" y="299" text-anchor="middle" class="celltext">已定</text>
  <rect x="376" y="271" width="84" height="46" rx="5" class="fixed"/><text x="418" y="299" text-anchor="middle" class="celltext">已定</text>
  <rect x="474" y="271" width="84" height="46" rx="5" class="fixed"/><text x="516" y="299" text-anchor="middle" class="celltext">已定</text>
  <rect x="572" y="271" width="84" height="46" rx="5" class="guided"/><text x="614" y="299" text-anchor="middle" class="celltext">参考旧块</text>
  <rect x="670" y="271" width="84" height="46" rx="5" class="guided"/><text x="712" y="299" text-anchor="middle" class="celltext">参考旧块</text>
  <rect x="768" y="271" width="84" height="46" rx="5" class="guided"/><text x="810" y="299" text-anchor="middle" class="celltext">参考旧块</text>
  <rect x="866" y="271" width="84" height="46" rx="5" class="guided"/><text x="908" y="299" text-anchor="middle" class="celltext">参考旧块</text>
  <rect x="964" y="271" width="84" height="46" rx="5" class="new"/><text x="1006" y="299" text-anchor="middle" class="celltext">新生成</text>
  <text x="32" y="379" class="rowlabel">实际执行</text>
  <rect x="180" y="349" width="84" height="46" rx="5" class="old"/><text x="222" y="377" text-anchor="middle" class="celltext">旧块</text>
  <rect x="278" y="349" width="84" height="46" rx="5" class="old"/><text x="320" y="377" text-anchor="middle" class="celltext">旧块</text>
  <rect x="376" y="349" width="84" height="46" rx="5" class="old"/><text x="418" y="377" text-anchor="middle" class="celltext">旧块</text>
  <rect x="474" y="349" width="84" height="46" rx="5" class="old"/><text x="516" y="377" text-anchor="middle" class="celltext">旧块</text>
  <rect x="572" y="349" width="84" height="46" rx="5" class="new"/><text x="614" y="377" text-anchor="middle" class="celltext">新块</text>
  <rect x="670" y="349" width="84" height="46" rx="5" class="new"/><text x="712" y="377" text-anchor="middle" class="celltext">新块</text>
  <rect x="768" y="349" width="84" height="46" rx="5" class="new"/><text x="810" y="377" text-anchor="middle" class="celltext">新块</text>
  <rect x="866" y="349" width="84" height="46" rx="5" class="new"/><text x="908" y="377" text-anchor="middle" class="celltext">新块</text>
  <rect x="964" y="349" width="84" height="46" rx="5" class="new"/><text x="1006" y="377" text-anchor="middle" class="celltext">新块</text>
  <line x1="565" y1="104" x2="565" y2="411" class="switch"/>
  <text x="575" y="427" class="note">新块可用并接管</text>
  <text x="180" y="467" class="note">橙色：已由旧块确定　蓝色：与旧计划重叠，可柔性参考　绿色：交给控制器的新动作</text>
</svg>

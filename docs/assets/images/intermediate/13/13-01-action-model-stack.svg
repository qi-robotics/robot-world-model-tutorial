<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">生成式 Action Model 模块栈</title><desc id="desc">观测经过上下文模型、动作专家、后处理和候选过滤，最终把动作前缀交给控制器。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.input{fill:#f8fafc;stroke:#64748b;stroke-width:2}.context{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.expert{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.post{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.exec{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1100" height="500" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">从观测到可执行动作要经过明确的接口边界</text><rect x="45" y="150" width="170" height="120" rx="16" class="input"/><text x="130" y="190" text-anchor="middle" class="head">多模态输入</text><text x="130" y="220" text-anchor="middle" class="small">观测、历史、目标</text><text x="130" y="245" text-anchor="middle" class="small">时间戳与有效位</text><rect x="255" y="150" width="180" height="120" rx="16" class="context"/><text x="345" y="190" text-anchor="middle" class="head">Context Model</text><text x="345" y="220" text-anchor="middle" class="small">任务相关 token</text><text x="345" y="245" text-anchor="middle" class="small">Context 版本</text><rect x="475" y="150" width="180" height="120" rx="16" class="expert"/><text x="565" y="190" text-anchor="middle" class="head">Action Expert</text><text x="565" y="220" text-anchor="middle" class="small">K 个归一化 chunk</text><text x="565" y="245" text-anchor="middle" class="small">AR / ACT / Diffusion / Flow</text><rect x="695" y="150" width="180" height="120" rx="16" class="post"/><text x="785" y="190" text-anchor="middle" class="head">后处理与过滤</text><text x="785" y="220" text-anchor="middle" class="small">反归一化、限幅</text><text x="785" y="245" text-anchor="middle" class="small">局部约束与候选</text><rect x="915" y="150" width="150" height="120" rx="16" class="exec"/><text x="990" y="190" text-anchor="middle" class="head">执行器</text><text x="990" y="220" text-anchor="middle" class="small">动作缓冲</text><text x="990" y="245" text-anchor="middle" class="small">执行前 Hₑ 步</text><path d="M215 210H247M435 210H467M655 210H687M875 210H907" class="arrow"/><rect x="280" y="340" width="540" height="82" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="550" y="373" text-anchor="middle" class="head">端到端记录：schema、统计量、随机种子、NFE、延迟、模型版本</text><text x="550" y="400" text-anchor="middle" class="small">模块化不是割裂训练，而是让数据责任、故障位置和评测条件可追踪</text></svg>

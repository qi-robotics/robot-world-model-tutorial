<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Action Expert 结构权衡</title><desc id="desc">从生成方式、典型优点、主要代价和适用场景对比自回归、ACT/CVAE、Diffusion 与 Flow。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 16px sans-serif;fill:#1e293b}.text{font:14px sans-serif;fill:#475569}.small{font:13px sans-serif;fill:#64748b}.header{fill:#e2e8f0;stroke:#64748b;stroke-width:1.5}.row1{fill:#f8fafc;stroke:#cbd5e1}.row2{fill:#eff6ff;stroke:#cbd5e1}.line{stroke:#cbd5e1;stroke-width:1.2}</style></defs><rect width="1100" height="540" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">先明确实时预算和动作分布，再选择生成结构</text><rect x="45" y="80" width="1010" height="56" rx="8" class="header"/><g class="head" text-anchor="middle"><text x="145" y="115">Expert</text><text x="325" y="115">生成方式</text><text x="535" y="115">典型优点</text><text x="750" y="115">主要代价</text><text x="950" y="115">需要重点检查</text></g><rect x="45" y="136" width="1010" height="78" class="row1"/><rect x="45" y="214" width="1010" height="78" class="row2"/><rect x="45" y="292" width="1010" height="78" class="row1"/><rect x="45" y="370" width="1010" height="78" class="row2"/><g class="line"><line x1="235" y1="80" x2="235" y2="448"/><line x1="425" y1="80" x2="425" y2="448"/><line x1="645" y1="80" x2="645" y2="448"/><line x1="855" y1="80" x2="855" y2="448"/></g><g class="head" text-anchor="middle"><text x="140" y="180">自回归</text><text x="140" y="258">ACT / CVAE</text><text x="140" y="336">Diffusion</text><text x="140" y="414">Flow</text></g><g class="text" text-anchor="middle"><text x="330" y="171">按时间或 token</text><text x="330" y="192">逐步生成</text><text x="535" y="171">顺序因子分解清晰</text><text x="535" y="192">适合离散动作</text><text x="750" y="171">推理串行</text><text x="750" y="192">误差进入后续条件</text><text x="950" y="171">teacher forcing</text><text x="950" y="192">采样温度与尾延迟</text><text x="330" y="249">action query</text><text x="330" y="270">一次解码整块</text><text x="535" y="249">网络调用少</text><text x="535" y="270">chunk 连贯</text><text x="750" y="249">潜变量可能被忽略</text><text x="750" y="270">长度通常固定</text><text x="950" y="249">KL 与模式覆盖</text><text x="950" y="270">temporal ensemble</text><text x="330" y="327">从噪声反复</text><text x="330" y="348">去噪整块</text><text x="535" y="327">连续多峰表达灵活</text><text x="535" y="348">训练通常稳定</text><text x="750" y="327">多次网络调用</text><text x="750" y="348">采样器选择多</text><text x="950" y="327">schedule、NFE</text><text x="950" y="348">guidance 与边界</text><text x="330" y="405">沿条件速度场</text><text x="330" y="426">ODE 积分</text><text x="535" y="405">连续运输接口</text><text x="535" y="426">可使用多种求解器</text><text x="750" y="405">路径和积分误差</text><text x="750" y="426">成本依赖求解器</text><text x="950" y="405">路径、耦合、NFE</text><text x="950" y="426">少步质量</text></g><rect x="180" y="475" width="740" height="44" rx="10" fill="#fff7ed" stroke="#ea580c"/><text x="550" y="503" text-anchor="middle" class="head">表中是典型倾向；公平结论来自同一 Context、动作接口、硬件和闭环任务</text></svg>

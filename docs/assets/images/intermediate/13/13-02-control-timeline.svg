<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">异步动作生成与控制时间线</title><desc id="desc">策略线程较慢地生成动作块，控制线程持续消费缓冲，新块在明确切换点接管。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.policy{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.control{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}.old{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}.switch{stroke:#ea580c;stroke-width:3;stroke-dasharray:7 5}.line{stroke:#94a3b8;stroke-width:2}</style></defs><rect width="1120" height="520" fill="#fff"/><text x="560" y="42" text-anchor="middle" class="title">慢策略线程与快控制线程通过动作缓冲解耦</text><text x="55" y="130" class="head">策略线程</text><line x1="175" y1="122" x2="1050" y2="122" class="line"/><rect x="205" y="88" width="210" height="68" rx="11" class="policy"/><text x="310" y="116" text-anchor="middle" class="head">Context v12 → 生成</text><text x="310" y="141" text-anchor="middle" class="small">推理期间缓冲继续执行</text><rect x="535" y="88" width="250" height="68" rx="11" class="policy"/><text x="660" y="116" text-anchor="middle" class="head">Context v13 → 生成</text><text x="660" y="141" text-anchor="middle" class="small">到达时检查是否过期</text><text x="55" y="265" class="head">控制线程</text><line x1="175" y1="257" x2="1050" y2="257" class="line"/><g class="old"><rect x="205" y="225" width="80" height="64" rx="8"/><rect x="290" y="225" width="80" height="64" rx="8"/><rect x="375" y="225" width="80" height="64" rx="8"/></g><g class="control"><rect x="460" y="225" width="80" height="64" rx="8"/><rect x="545" y="225" width="80" height="64" rx="8"/><rect x="630" y="225" width="80" height="64" rx="8"/><rect x="715" y="225" width="80" height="64" rx="8"/><rect x="800" y="225" width="80" height="64" rx="8"/><rect x="885" y="225" width="80" height="64" rx="8"/></g><g class="small" text-anchor="middle"><text x="245" y="263">旧块</text><text x="330" y="263">旧块</text><text x="415" y="263">旧块</text><text x="500" y="263">v12</text><text x="585" y="263">v12</text><text x="670" y="263">v12</text><text x="755" y="263">v13</text><text x="840" y="263">v13</text><text x="925" y="263">v13</text></g><line x1="457" y1="175" x2="457" y2="315" class="switch"/><line x1="712" y1="175" x2="712" y2="315" class="switch"/><text x="457" y="338" text-anchor="middle" class="text">明确切换点</text><text x="712" y="338" text-anchor="middle" class="text">下一切换点</text><rect x="205" y="385" width="760" height="78" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="585" y="416" text-anchor="middle" class="head">每个动作块携带 Context 版本、起始执行时刻和 schema</text><text x="585" y="443" text-anchor="middle" class="small">缓冲不足触发降级；结果过期则丢弃；不能让迟到的旧计划覆盖新状态</text></svg>

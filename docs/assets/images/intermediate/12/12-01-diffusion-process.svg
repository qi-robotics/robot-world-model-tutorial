<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Diffusion 前向加噪与反向生成</title><desc id="desc">干净动作经过已知前向过程逐步成为噪声，生成时网络在上下文条件下逐步去噪。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.clean{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.mid{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.noise{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.context{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.forward{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#g)}.reverse{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#b)}</style><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker></defs><rect width="1100" height="500" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">Diffusion 训练破坏过程，生成学习反向过程</text><g><rect x="70" y="165" width="175" height="95" rx="16" class="clean"/><text x="157" y="202" text-anchor="middle" class="head">干净动作 x₀</text><text x="157" y="232" text-anchor="middle" class="small">多峰 Action Chunk</text><rect x="330" y="165" width="175" height="95" rx="16" class="mid"/><text x="417" y="202" text-anchor="middle" class="head">带噪动作 xₖ</text><text x="417" y="232" text-anchor="middle" class="small">仍保留部分结构</text><rect x="590" y="165" width="175" height="95" rx="16" class="mid"/><text x="677" y="202" text-anchor="middle" class="head">高噪声 xₖ</text><text x="677" y="232" text-anchor="middle" class="small">结构逐渐消失</text><rect x="850" y="165" width="175" height="95" rx="16" class="noise"/><text x="937" y="202" text-anchor="middle" class="head">噪声 xₖ</text><text x="937" y="232" text-anchor="middle" class="small">近似 N(0, I)</text></g><path d="M245 190H322M505 190H582M765 190H842" class="forward"/><text x="550" y="130" text-anchor="middle" class="text">前向：已知噪声日程 q(xₖ | x₀)</text><path d="M850 238H773M590 238H513M330 238H253" class="reverse"/><text x="550" y="310" text-anchor="middle" class="text">生成：网络反复估计去噪方向</text><rect x="405" y="355" width="290" height="78" rx="14" class="context"/><text x="550" y="386" text-anchor="middle" class="head">εθ(xₖ, k, Context)</text><text x="550" y="412" text-anchor="middle" class="small">带噪动作 + 噪声等级 + 任务条件</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Flow Matching 速度场</title><desc id="desc">噪声点沿学习到的条件速度场运输到两个动作数据模式。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.noise{fill:#94a3b8}.upper{fill:#2563eb}.lower{fill:#7c3aed}.path1{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#b)}.path2{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#p)}.box{fill:#fff7ed;stroke:#ea580c;stroke-width:2}</style><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7c3aed"/></marker></defs><rect width="1080" height="520" fill="#fff"/><text x="540" y="42" text-anchor="middle" class="title">速度场告诉每个中间样本下一刻向哪里移动</text><g class="noise"><circle cx="120" cy="185" r="9"/><circle cx="145" cy="240" r="9"/><circle cx="112" cy="300" r="9"/><circle cx="165" cy="350" r="9"/></g><text x="135" y="405" text-anchor="middle" class="head">噪声 p₀</text><path d="M170 240C350 90 610 100 835 170" class="path1"/><path d="M170 280C350 430 610 420 835 345" class="path2"/><path d="M165 190C330 155 580 170 835 190" class="path1" opacity=".45"/><path d="M165 340C330 375 580 355 835 325" class="path2" opacity=".45"/><g class="upper"><circle cx="870" cy="145" r="12"/><circle cx="910" cy="175" r="12"/><circle cx="855" cy="205" r="12"/><circle cx="930" cy="220" r="12"/></g><g class="lower"><circle cx="870" cy="300" r="12"/><circle cx="925" cy="325" r="12"/><circle cx="855" cy="355" r="12"/><circle cx="905" cy="385" r="12"/></g><text x="895" y="430" text-anchor="middle" class="head">动作数据 p₁</text><rect x="360" y="215" width="360" height="92" rx="15" class="box"/><text x="540" y="248" text-anchor="middle" class="head">dx / ds = vθ(x, s, Context)</text><text x="540" y="278" text-anchor="middle" class="small">训练监督局部速度，生成时数值积分</text><text x="540" y="478" text-anchor="middle" class="text">不同 Context 会改变速度场，从而把相同噪声运输到不同动作条件分布</text></svg>

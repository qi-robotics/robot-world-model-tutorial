<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">Diffusion 与 Flow Matching 比较</title><desc id="desc">两种方法共享条件迭代生成接口，但训练监督和采样更新不同。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 18px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.left{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.right{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.shared{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{stroke:#cbd5e1;stroke-width:1.5}</style></defs><rect width="1100" height="540" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">相同外部接口，不同训练目标与数值路径</text><rect x="55" y="82" width="455" height="330" rx="18" class="left"/><text x="282" y="118" text-anchor="middle" class="head">Diffusion</text><line x1="85" y1="140" x2="480" y2="140" class="line"/><text x="90" y="178" class="text">训练样本</text><text x="235" y="178" class="small">按噪声日程构造 xₖ</text><text x="90" y="226" class="text">常见监督</text><text x="235" y="226" class="small">噪声、x₀、score 或 velocity</text><text x="90" y="274" class="text">生成</text><text x="235" y="274" class="small">反向去噪更新 / SDE / ODE</text><text x="90" y="322" class="text">关键选择</text><text x="235" y="322" class="small">schedule、sampler、步数、guidance</text><text x="90" y="370" class="text">输出</text><text x="235" y="370" class="small">条件 Action Chunk 样本</text><rect x="590" y="82" width="455" height="330" rx="18" class="right"/><text x="817" y="118" text-anchor="middle" class="head">Flow Matching</text><line x1="620" y1="140" x2="1015" y2="140" class="line"/><text x="625" y="178" class="text">训练样本</text><text x="770" y="178" class="small">在选定概率路径上抽取 xₛ</text><text x="625" y="226" class="text">常见监督</text><text x="770" y="226" class="small">路径对应的条件速度</text><text x="625" y="274" class="text">生成</text><text x="770" y="274" class="small">求解常微分方程 dx/ds = v</text><text x="625" y="322" class="text">关键选择</text><text x="770" y="322" class="small">路径、耦合、求解器、步数</text><text x="625" y="370" class="text">输出</text><text x="770" y="370" class="small">条件 Action Chunk 样本</text><rect x="205" y="445" width="690" height="64" rx="14" class="shared"/><text x="550" y="473" text-anchor="middle" class="head">共同输入：噪声样本 + 生成时间 + Context</text><text x="550" y="497" text-anchor="middle" class="small">公平比较要报告网络调用次数、墙钟延迟、样本质量与闭环成功率</text></svg>

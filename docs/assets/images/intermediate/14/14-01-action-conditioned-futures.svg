<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="500" viewBox="0 0 1060 500" role="img" aria-labelledby="title desc"><title id="title">同一状态在不同动作下的未来</title><desc id="desc">当前方块状态相同，向左、保持和向右动作产生三个不同下一状态。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.state{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.future{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.bad{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1060" height="500" fill="#fff"/><text x="530" y="42" text-anchor="middle" class="title">预测未来时，动作不是可省略的附加输入</text><rect x="80" y="175" width="190" height="115" rx="16" class="state"/><text x="175" y="215" text-anchor="middle" class="head">当前状态 sₜ</text><text x="175" y="246" text-anchor="middle" class="small">方块位置相同</text><path d="M270 205C350 140 400 125 470 125" class="arrow"/><path d="M270 232H470" class="arrow"/><path d="M270 260C350 325 400 340 470 340" class="arrow"/><text x="355" y="135" text-anchor="middle" class="text">动作：向左</text><text x="355" y="220" text-anchor="middle" class="text">动作：保持</text><text x="355" y="350" text-anchor="middle" class="text">动作：向右</text><rect x="485" y="78" width="200" height="95" rx="14" class="future"/><text x="585" y="116" text-anchor="middle" class="head">未来 1</text><text x="585" y="144" text-anchor="middle" class="small">位置向左变化</text><rect x="485" y="185" width="200" height="95" rx="14" class="future"/><text x="585" y="223" text-anchor="middle" class="head">未来 2</text><text x="585" y="251" text-anchor="middle" class="small">位置近似不变</text><rect x="485" y="292" width="200" height="95" rx="14" class="future"/><text x="585" y="330" text-anchor="middle" class="head">未来 3</text><text x="585" y="358" text-anchor="middle" class="small">位置向右变化</text><rect x="755" y="175" width="235" height="115" rx="16" class="bad"/><text x="872" y="213" text-anchor="middle" class="head">忽略动作的预测</text><text x="872" y="242" text-anchor="middle" class="small">只能平均数据中的变化</text><text x="872" y="267" text-anchor="middle" class="small">无法比较候选后果</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">World Model 的训练与候选预测接口</title><desc id="desc">上半部分使用真实转移训练，下半部分把同一当前表示和多条候选动作输入模型得到多个候选未来。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.state{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.action{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.model{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.future{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1100" height="520" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">训练学习真实转移，使用时并行想象候选未来</text><text x="55" y="105" class="head">训练</text><rect x="150" y="75" width="150" height="65" rx="11" class="state"/><text x="225" y="114" text-anchor="middle" class="head">当前 zₜ</text><rect x="340" y="75" width="150" height="65" rx="11" class="action"/><text x="415" y="114" text-anchor="middle" class="head">实际动作 aₜ</text><rect x="550" y="75" width="180" height="65" rx="11" class="model"/><text x="640" y="114" text-anchor="middle" class="head">World Model</text><rect x="790" y="75" width="160" height="65" rx="11" class="future"/><text x="870" y="114" text-anchor="middle" class="head">下一 zₜ₊₁</text><path d="M300 107H332M490 107H542M730 107H782" class="arrow"/><line x1="55" y1="190" x2="1045" y2="190" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="248" class="head">使用</text><rect x="150" y="220" width="150" height="65" rx="11" class="state"/><text x="225" y="259" text-anchor="middle" class="head">同一当前 zₜ</text><g class="action"><rect x="340" y="215" width="160" height="48" rx="9"/><rect x="340" y="273" width="160" height="48" rx="9"/><rect x="340" y="331" width="160" height="48" rx="9"/></g><g class="text" text-anchor="middle"><text x="420" y="245">候选动作 A¹</text><text x="420" y="303">候选动作 A²</text><text x="420" y="361">候选动作 Aᴷ</text></g><rect x="560" y="245" width="180" height="105" rx="14" class="model"/><text x="650" y="286" text-anchor="middle" class="head">共享 World Model</text><text x="650" y="318" text-anchor="middle" class="small">候选维并入 batch</text><g class="future"><rect x="800" y="215" width="180" height="48" rx="9"/><rect x="800" y="273" width="180" height="48" rx="9"/><rect x="800" y="331" width="180" height="48" rx="9"/></g><g class="text" text-anchor="middle"><text x="890" y="245">候选未来 Ẑ¹</text><text x="890" y="303">候选未来 Ẑ²</text><text x="890" y="361">候选未来 Ẑᴷ</text></g><path d="M300 252H332M500 238H552M500 297H552M500 355H552M740 270H792M740 298H792M740 326H792" class="arrow"/><rect x="230" y="425" width="640" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="550" y="460" text-anchor="middle" class="head">输出预测未来、有效位、rollout horizon、模型版本与不确定性来源</text></svg>

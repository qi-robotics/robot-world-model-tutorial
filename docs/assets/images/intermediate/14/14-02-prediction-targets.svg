<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">三种世界模型预测目标</title><desc id="desc">对比结构化状态预测、像素预测和潜空间预测的接口及权衡。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 18px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.state{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.pixel{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.latent{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1100" height="520" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">预测目标决定模型必须保留什么信息</text><rect x="35" y="82" width="330" height="370" rx="18" class="panel"/><text x="200" y="120" text-anchor="middle" class="head">结构化状态</text><rect x="80" y="160" width="105" height="70" rx="11" class="state"/><text x="132" y="189" text-anchor="middle" class="text">sₜ</text><text x="132" y="214" text-anchor="middle" class="small">位姿 / 速度</text><rect x="225" y="160" width="105" height="70" rx="11" class="state"/><text x="277" y="189" text-anchor="middle" class="text">ŝₜ₊₁</text><text x="277" y="214" text-anchor="middle" class="small">可解释未来</text><path d="M185 195H217" class="arrow"/><text x="200" y="290" text-anchor="middle" class="text">紧凑、便于约束和评价</text><text x="200" y="325" text-anchor="middle" class="small">但真机未必提供完整状态</text><text x="200" y="395" text-anchor="middle" class="small">适合仿真真值与状态估计可靠任务</text><rect x="385" y="82" width="330" height="370" rx="18" class="panel"/><text x="550" y="120" text-anchor="middle" class="head">像素 / 视频</text><rect x="430" y="160" width="105" height="70" rx="11" class="pixel"/><text x="482" y="189" text-anchor="middle" class="text">Iₜ</text><text x="482" y="214" text-anchor="middle" class="small">当前图像</text><rect x="575" y="160" width="105" height="70" rx="11" class="pixel"/><text x="627" y="189" text-anchor="middle" class="text">Îₜ₊₁</text><text x="627" y="214" text-anchor="middle" class="small">未来像素</text><path d="M535 195H567" class="arrow"/><text x="550" y="290" text-anchor="middle" class="text">直接使用可观测数据</text><text x="550" y="325" text-anchor="middle" class="small">纹理成本高，多峰 MSE 易模糊</text><text x="550" y="395" text-anchor="middle" class="small">视觉逼真不等于规划误差小</text><rect x="735" y="82" width="330" height="370" rx="18" class="panel"/><text x="900" y="120" text-anchor="middle" class="head">潜表示</text><rect x="770" y="152" width="80" height="78" rx="11" class="pixel"/><text x="810" y="198" text-anchor="middle" class="text">E(Iₜ)</text><rect x="885" y="152" width="80" height="78" rx="11" class="latent"/><text x="925" y="198" text-anchor="middle" class="text">ẑₜ₊₁</text><rect x="990" y="152" width="48" height="78" rx="11" class="pixel"/><text x="1014" y="198" text-anchor="middle" class="text">D</text><path d="M850 191H877M965 191H982" class="arrow"/><text x="900" y="290" text-anchor="middle" class="text">压缩后预测，计算更低</text><text x="900" y="325" text-anchor="middle" class="small">信息由编码目标决定</text><text x="900" y="395" text-anchor="middle" class="small">要验证是否保留几何与任务事件</text></svg>

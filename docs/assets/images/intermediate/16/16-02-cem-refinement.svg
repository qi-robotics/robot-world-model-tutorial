<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">CEM 迭代聚焦动作分布</title><desc id="desc">从宽分布采样候选，经过世界模型评分和精英筛选，后续分布逐步聚焦到低代价动作区域。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.model{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.elite{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#a)}.dot{fill:#94a3b8}.good{fill:#16a34a}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1100" height="520" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">CEM：让采样分布逐轮靠近低代价动作</text><text x="165" y="92" text-anchor="middle" class="head">第 0 轮：分布较宽</text><ellipse cx="165" cy="205" rx="105" ry="82" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><g class="dot"><circle cx="95" cy="172" r="5"/><circle cx="123" cy="236" r="5"/><circle cx="158" cy="145" r="5"/><circle cx="194" cy="251" r="5"/><circle cx="226" cy="185" r="5"/><circle cx="181" cy="207" r="5"/><circle cx="105" cy="205" r="5"/><circle cx="215" cy="226" r="5"/></g><g class="good"><circle cx="194" cy="187" r="7"/><circle cx="214" cy="201" r="7"/><circle cx="204" cy="218" r="7"/></g><rect x="330" y="143" width="190" height="120" rx="14" class="model"/><text x="425" y="181" text-anchor="middle" class="head">World Model rollout</text><text x="425" y="211" text-anchor="middle" class="small">目标 · 碰撞 · 动作 · 风险</text><text x="425" y="239" text-anchor="middle" class="small">为每条序列计算代价</text><path d="M270 205H322" class="arrow"/><rect x="600" y="143" width="175" height="120" rx="14" class="elite"/><text x="687" y="181" text-anchor="middle" class="head">选择 elite</text><text x="687" y="211" text-anchor="middle" class="small">保留最低代价样本</text><text x="687" y="239" text-anchor="middle" class="small">重新估计 μ 与 σ</text><path d="M520 203H592" class="arrow"/><text x="930" y="92" text-anchor="middle" class="head">后续轮：聚焦但不坍缩</text><ellipse cx="930" cy="205" rx="75" ry="58" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><g class="dot"><circle cx="900" cy="188" r="5"/><circle cx="918" cy="228" r="5"/><circle cx="949" cy="177" r="5"/><circle cx="968" cy="216" r="5"/></g><g class="good"><circle cx="934" cy="197" r="7"/><circle cx="949" cy="207" r="7"/><circle cx="930" cy="218" r="7"/></g><path d="M775 203H847" class="arrow"/><path d="M930 270C930 335 687 350 687 272" class="arrow"/><text x="820" y="336" text-anchor="middle" class="small">采样 → 评价 → elite → 更新，重复若干轮</text><rect x="175" y="405" width="750" height="60" rx="12" class="box"/><text x="550" y="431" text-anchor="middle" class="head">工程边界</text><text x="550" y="454" text-anchor="middle" class="small">动作裁剪 · 最小方差 · 全局最佳保留 · 样本预算 · 实时延迟</text></svg>

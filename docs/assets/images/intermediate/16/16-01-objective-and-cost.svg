<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">从任务目标到候选未来评分</title><desc id="desc">任务目标分别连接成功判定、软代价与硬约束，三个候选未来经过分项评价后得到选择结果。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:15px sans-serif;fill:#475569}.small{font:14px sans-serif;fill:#64748b}.goal{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.score{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.safe{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.future{fill:#f8fafc;stroke:#64748b;stroke-width:2}.pick{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="1100" height="520" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">先定义任务，再比较候选未来</text><rect x="55" y="190" width="180" height="90" rx="14" class="goal"/><text x="145" y="226" text-anchor="middle" class="head">任务 goal</text><text x="145" y="253" text-anchor="middle" class="small">积木进入目标盒</text><rect x="300" y="80" width="205" height="75" rx="12" class="goal"/><text x="402" y="111" text-anchor="middle" class="head">success detector</text><text x="402" y="137" text-anchor="middle" class="small">最终是否完成</text><rect x="300" y="198" width="205" height="75" rx="12" class="score"/><text x="402" y="229" text-anchor="middle" class="head">soft cost</text><text x="402" y="255" text-anchor="middle" class="small">进展 · 能耗 · 平滑 · 风险</text><rect x="300" y="316" width="205" height="75" rx="12" class="safe"/><text x="402" y="347" text-anchor="middle" class="head">hard constraints</text><text x="402" y="373" text-anchor="middle" class="small">关节限位 · 碰撞 · 禁区</text><path d="M235 220C270 190 270 120 292 118M235 235H292M235 250C270 280 270 350 292 353" class="arrow"/><rect x="585" y="75" width="190" height="85" rx="12" class="future"/><text x="680" y="107" text-anchor="middle" class="head">候选未来 A</text><text x="680" y="134" text-anchor="middle" class="small">较短但碰撞 → 排除</text><rect x="585" y="195" width="190" height="85" rx="12" class="future"/><text x="680" y="227" text-anchor="middle" class="head">候选未来 B</text><text x="680" y="254" text-anchor="middle" class="small">安全但离目标较远</text><rect x="585" y="315" width="190" height="85" rx="12" class="future"/><text x="680" y="347" text-anchor="middle" class="head">候选未来 C</text><text x="680" y="374" text-anchor="middle" class="small">安全且进展充分</text><path d="M505 117H577M505 235H577M505 353H577" class="arrow"/><rect x="855" y="188" width="185" height="100" rx="15" class="pick"/><text x="947" y="225" text-anchor="middle" class="head">选择候选 C</text><text x="947" y="254" text-anchor="middle" class="small">保留分项与约束余量</text><path d="M775 357C820 350 815 250 847 240" class="arrow"/><rect x="265" y="440" width="570" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="550" y="469" text-anchor="middle" class="text">总分用于排序；成功、约束和各代价分量仍需独立记录</text></svg>

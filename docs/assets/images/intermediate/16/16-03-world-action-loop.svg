<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">World Action MPC 闭环</title><desc id="desc">观测经过上下文模型和动作专家生成候选，经世界模型、评价器和规划器选择前缀，执行后重新观测。</desc><defs><style>.title{font:700 25px sans-serif;fill:#172033}.head{font:700 16px sans-serif;fill:#1e293b}.small{font:14px sans-serif;fill:#64748b}.sense{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.action{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.world{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.plan{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.real{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#a)}.feedback{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-dasharray:8 5;marker-end:url(#b)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker></defs><rect width="1100" height="560" fill="#fff"/><text x="550" y="42" text-anchor="middle" class="title">生成候选、想象后果、执行前缀、重新观测</text><rect x="45" y="175" width="150" height="95" rx="14" class="sense"/><text x="120" y="210" text-anchor="middle" class="head">真实观测与历史</text><text x="120" y="238" text-anchor="middle" class="small">多模态输入与历史</text><rect x="235" y="175" width="150" height="95" rx="14" class="sense"/><text x="310" y="210" text-anchor="middle" class="head">Context / belief</text><text x="310" y="238" text-anchor="middle" class="small">任务条件与当前估计</text><rect x="425" y="175" width="150" height="95" rx="14" class="action"/><text x="500" y="210" text-anchor="middle" class="head">Action Expert</text><text x="500" y="238" text-anchor="middle" class="small">候选动作 A¹ … Aᴷ</text><rect x="615" y="175" width="150" height="95" rx="14" class="world"/><text x="690" y="210" text-anchor="middle" class="head">World Model</text><text x="690" y="238" text-anchor="middle" class="small">未来样本与不确定性</text><rect x="805" y="175" width="150" height="95" rx="14" class="plan"/><text x="880" y="207" text-anchor="middle" class="head">评价 + CEM / MPC</text><text x="880" y="235" text-anchor="middle" class="small">目标 · 约束 · 风险</text><path d="M195 222H227M385 222H417M575 222H607M765 222H797" class="arrow"/><rect x="805" y="340" width="150" height="85" rx="14" class="real"/><text x="880" y="373" text-anchor="middle" class="head">执行计划短前缀</text><text x="880" y="400" text-anchor="middle" class="small">低层控制与安全检查</text><path d="M880 270V332" class="arrow"/><rect x="425" y="340" width="240" height="85" rx="14" class="real"/><text x="545" y="373" text-anchor="middle" class="head">真实环境发生变化</text><text x="545" y="400" text-anchor="middle" class="small">扰动、接触和模型误差在此显现</text><path d="M805 382H673" class="arrow"/><path d="M425 382C250 382 120 360 120 278" class="feedback"/><text x="246" y="360" text-anchor="middle" class="small">重新观测并修正，而不是继续相信旧计划</text><rect x="245" y="485" width="610" height="48" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="550" y="515" text-anchor="middle" class="head">闭环日志同时保存：候选、预测、分项代价、不确定性、实际动作与真实结果</text></svg>

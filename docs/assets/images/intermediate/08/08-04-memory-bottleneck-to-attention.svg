<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">循环记忆瓶颈引出 Attention</title>
  <desc id="desc">上半部分把全部历史压入最后隐藏状态，下半部分保留各时刻隐藏状态，并由当前查询直接读取相关位置。</desc>
  <defs>
    <style>
      .title{font:700 25px sans-serif;fill:#172033}.head{font:700 18px sans-serif;fill:#1e293b}.text{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.token{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.rnn{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.bottle{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}.attn{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5}.context{fill:#ecfdf5;stroke:#16a34a;stroke-width:2.5}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.select{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#purple)}.divider{stroke:#cbd5e1;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1080" height="600" fill="#ffffff"/>
  <text x="540" y="42" text-anchor="middle" class="title">从“把一切记住”到“按问题读取”</text>

  <text x="42" y="92" class="head">只读取最后隐藏状态</text>
  <g transform="translate(70,120)">
    <rect x="0" y="0" width="90" height="54" rx="10" class="token"/><text x="45" y="34" text-anchor="middle" class="text">x₁</text>
    <rect x="145" y="0" width="90" height="54" rx="10" class="token"/><text x="190" y="34" text-anchor="middle" class="text">x₂</text>
    <rect x="290" y="0" width="90" height="54" rx="10" class="token"/><text x="335" y="34" text-anchor="middle" class="text">x₃</text>
    <rect x="435" y="0" width="90" height="54" rx="10" class="token"/><text x="480" y="34" text-anchor="middle" class="text">…</text>
    <path d="M92 27H137" class="arrow"/><path d="M237 27H282" class="arrow"/><path d="M382 27H427" class="arrow"/>
    <path d="M527 27H598" class="arrow"/>
    <rect x="610" y="-10" width="175" height="74" rx="15" class="bottle"/><text x="698" y="20" text-anchor="middle" class="head">最后状态 hₜ</text><text x="698" y="47" text-anchor="middle" class="small">全部历史挤进一个向量</text>
    <path d="M787 27H855" class="arrow"/>
    <rect x="865" y="0" width="105" height="54" rx="10" class="context"/><text x="918" y="34" text-anchor="middle" class="text">决策</text>
  </g>

  <line x1="40" y1="255" x2="1040" y2="255" class="divider"/>
  <text x="42" y="302" class="head">保留历史表示，再由当前查询读取</text>
  <g transform="translate(70,350)">
    <rect x="0" y="0" width="90" height="54" rx="10" class="rnn"/><text x="45" y="34" text-anchor="middle" class="text">h₁</text>
    <rect x="145" y="0" width="90" height="54" rx="10" class="rnn"/><text x="190" y="34" text-anchor="middle" class="text">h₂</text>
    <rect x="290" y="0" width="90" height="54" rx="10" class="rnn"/><text x="335" y="34" text-anchor="middle" class="text">h₃</text>
    <rect x="435" y="0" width="90" height="54" rx="10" class="rnn"/><text x="480" y="34" text-anchor="middle" class="text">hₜ</text>
    <rect x="195" y="105" width="205" height="58" rx="13" class="attn"/><text x="298" y="130" text-anchor="middle" class="head">当前查询 qₜ</text><text x="298" y="152" text-anchor="middle" class="small">现在需要知道什么？</text>
    <path d="M215 105L190 62" class="select"/><path d="M285 105L335 62" class="select"/><path d="M355 105L480 62" class="select"/>
    <path d="M403 134H610" class="select"/>
    <rect x="625" y="93" width="190" height="80" rx="15" class="context"/><text x="720" y="125" text-anchor="middle" class="head">相关历史上下文</text><text x="720" y="151" text-anchor="middle" class="small">按当前问题加权读取</text>
    <path d="M817 133H878" class="arrow"/>
    <rect x="890" y="106" width="90" height="54" rx="10" class="context"/><text x="935" y="140" text-anchor="middle" class="text">决策</text>
  </g>
  <text x="540" y="570" text-anchor="middle" class="small">Attention 不要求最后状态独自保存所有细节，而是直接比较查询与多个历史位置</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">RNN 从隐藏状态产生逐时刻预测</title>
  <desc id="desc">每个时间步的输入更新隐藏状态，隐藏状态传递到下一时刻，同时经过共享输出头产生当前预测 y 帽 t。</desc>
  <defs>
    <style>
      .title{font:700 25px sans-serif;fill:#172033}.head{font:700 17px sans-serif;fill:#1e293b}.text{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.cell{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.input{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.hidden{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.prediction{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.thin{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect width="1080" height="540" fill="#ffffff"/>
  <text x="540" y="35" text-anchor="middle" class="title">RNN 用隐藏状态记忆历史，并逐时刻产生预测</text>

  <g transform="translate(84,245)">
    <rect x="0" y="0" width="130" height="86" rx="14" class="cell"/>
    <text x="65" y="35" text-anchor="middle" class="head">RNN 单元</text><text x="65" y="61" text-anchor="middle" class="small">共享参数 θ</text>
    <rect x="20" y="-100" width="90" height="46" rx="10" class="hidden"/><text x="65" y="-71" text-anchor="middle" class="text">h₁</text>
    <rect x="20" y="-185" width="90" height="46" rx="10" class="prediction"/><text x="65" y="-156" text-anchor="middle" class="text">ŷ₁</text>
    <rect x="20" y="135" width="90" height="48" rx="10" class="input"/><text x="65" y="165" text-anchor="middle" class="text">x₁</text>
    <path d="M65 135V94" class="arrow"/><path d="M65 0V-50" class="arrow"/><path d="M65 -100V-130" class="thin"/>
  </g>
  <g transform="translate(334,245)">
    <rect x="0" y="0" width="130" height="86" rx="14" class="cell"/>
    <text x="65" y="35" text-anchor="middle" class="head">RNN 单元</text><text x="65" y="61" text-anchor="middle" class="small">共享参数 θ</text>
    <rect x="20" y="-100" width="90" height="46" rx="10" class="hidden"/><text x="65" y="-71" text-anchor="middle" class="text">h₂</text>
    <rect x="20" y="-185" width="90" height="46" rx="10" class="prediction"/><text x="65" y="-156" text-anchor="middle" class="text">ŷ₂</text>
    <rect x="20" y="135" width="90" height="48" rx="10" class="input"/><text x="65" y="165" text-anchor="middle" class="text">x₂</text>
    <path d="M65 135V94" class="arrow"/><path d="M65 0V-50" class="arrow"/><path d="M65 -100V-130" class="thin"/>
  </g>
  <g transform="translate(584,245)">
    <rect x="0" y="0" width="130" height="86" rx="14" class="cell"/>
    <text x="65" y="35" text-anchor="middle" class="head">RNN 单元</text><text x="65" y="61" text-anchor="middle" class="small">共享参数 θ</text>
    <rect x="20" y="-100" width="90" height="46" rx="10" class="hidden"/><text x="65" y="-71" text-anchor="middle" class="text">h₃</text>
    <rect x="20" y="-185" width="90" height="46" rx="10" class="prediction"/><text x="65" y="-156" text-anchor="middle" class="text">ŷ₃</text>
    <rect x="20" y="135" width="90" height="48" rx="10" class="input"/><text x="65" y="165" text-anchor="middle" class="text">x₃</text>
    <path d="M65 135V94" class="arrow"/><path d="M65 0V-50" class="arrow"/><path d="M65 -100V-130" class="thin"/>
  </g>
  <g transform="translate(834,245)">
    <rect x="0" y="0" width="130" height="86" rx="14" class="cell"/>
    <text x="65" y="35" text-anchor="middle" class="head">RNN 单元</text><text x="65" y="61" text-anchor="middle" class="small">共享参数 θ</text>
    <rect x="20" y="-100" width="90" height="46" rx="10" class="hidden"/><text x="65" y="-71" text-anchor="middle" class="text">hₜ</text>
    <rect x="20" y="-185" width="90" height="46" rx="10" class="prediction"/><text x="65" y="-156" text-anchor="middle" class="text">ŷₜ</text>
    <rect x="20" y="135" width="90" height="48" rx="10" class="input"/><text x="65" y="165" text-anchor="middle" class="text">xₜ</text>
    <path d="M65 135V94" class="arrow"/><path d="M65 0V-50" class="arrow"/><path d="M65 -100V-130" class="thin"/>
  </g>

  <path d="M214 288H326M464 288H576M714 288H826" class="arrow"/>
  <text x="270" y="276" text-anchor="middle" class="small">传递 h</text><text x="520" y="276" text-anchor="middle" class="small">传递 h</text><text x="770" y="276" text-anchor="middle" class="small">传递 h</text>
  <text x="540" y="495" text-anchor="middle" class="text">每步的 hₜ 汇总当前与过去信息；输出头把它映射为任务所需的预测 ŷₜ</text>
</svg>

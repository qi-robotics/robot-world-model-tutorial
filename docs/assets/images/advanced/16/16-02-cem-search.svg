<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="CEM 的一次迭代"><title>CEM 的一次迭代</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536875"/></marker></defs><rect width="1000" height="330" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif"><text x="500" y="32" text-anchor="middle" fill="#243746" font-size="23">更新采样分布，不更新世界模型</text><rect x="25" y="90" width="180" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="115" y="123.5" text-anchor="middle" fill="#243746" font-size="20">① 采样动作块</text><text x="115" y="150.5" text-anchor="middle" fill="#243746" font-size="20">均值与标准差</text><path d="M205,130 L275,130" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="90" width="180" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="365" y="123.5" text-anchor="middle" fill="#243746" font-size="20">② 预测与评分</text><text x="365" y="150.5" text-anchor="middle" fill="#243746" font-size="20">排除无效候选</text><path d="M455,130 L525,130" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="525" y="90" width="190" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="620" y="123.5" text-anchor="middle" fill="#243746" font-size="20">③ 保留较好候选</text><text x="620" y="150.5" text-anchor="middle" fill="#243746" font-size="20">不是全部取平均</text><path d="M715,130 L790,130" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="90" width="185" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="882.5" y="123.5" text-anchor="middle" fill="#243746" font-size="20">④ 重新计算</text><text x="882.5" y="150.5" text-anchor="middle" fill="#243746" font-size="20">均值与标准差</text><path d="M882,170 L882,250 L115,250 L115,170" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="286" text-anchor="middle" fill="#243746" font-size="18">用更新后的分布产生下一轮候选；结束后执行已检查的优良动作</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="预测与评价的职责"><title>预测与评价的职责</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536875"/></marker></defs><rect width="1000" height="360" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif"><text x="500" y="32" text-anchor="middle" fill="#243746" font-size="23">同一当前观测，比较多条动作的后果</text><rect x="20" y="120" width="180" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="110" y="153.5" text-anchor="middle" fill="#243746" font-size="20">候选 A / B / C</text><text x="110" y="180.5" text-anchor="middle" fill="#243746" font-size="20">先检查动作约束</text><path d="M200,160 L275,160" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="120" width="200" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="375" y="153.5" text-anchor="middle" fill="#243746" font-size="20">同一世界模型</text><text x="375" y="180.5" text-anchor="middle" fill="#243746" font-size="20">分别预测未来</text><path d="M475,160 L550,160" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="120" width="200" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="650" y="153.5" text-anchor="middle" fill="#243746" font-size="20">目标评价</text><text x="650" y="180.5" text-anchor="middle" fill="#243746" font-size="20">给每条候选评分</text><path d="M750,160 L815,160" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="120" width="160" height="80" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="895" y="153.5" text-anchor="middle" fill="#243746" font-size="20">选择并执行</text><text x="895" y="180.5" text-anchor="middle" fill="#243746" font-size="20">前一小段</text><rect x="550" y="265" width="200" height="60" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="650" y="302" text-anchor="middle" fill="#243746" font-size="20">目标状态或图像</text><path d="M650,265 L650,200" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="85" text-anchor="middle" fill="#243746" font-size="18">预测阶段不更新世界模型参数</text><text x="500" y="345" text-anchor="middle" fill="#243746" font-size="18">下一轮从新观测重新开始，而不是沿用想象的当前位置</text></g></svg>

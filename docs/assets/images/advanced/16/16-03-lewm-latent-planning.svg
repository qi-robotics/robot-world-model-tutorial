<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="LeWM 用目标图像、视觉表征预测和 CEM 搜索动作的流程">
  <title>LeWM 的视觉表征规划</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536875"/></marker>
  </defs>
  <rect width="1200" height="455" fill="#fff"/>
  <g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif" fill="#243746">
    <text x="600" y="35" text-anchor="middle" font-size="24" font-weight="600">把第 15 章的表征预测接到动作搜索</text>
    <text x="28" y="82" font-size="18" fill="#466477">当前画面</text>
    <text x="28" y="158" font-size="18" fill="#466477">目标画面</text>

    <rect x="145" y="52" width="145" height="55" rx="4" fill="#eef4f7" stroke="#627986" stroke-width="1.5"/>
    <text x="217.5" y="86" text-anchor="middle" font-size="18">当前图像 Iₜ</text>
    <rect x="145" y="128" width="145" height="55" rx="4" fill="#eef4f7" stroke="#627986" stroke-width="1.5"/>
    <text x="217.5" y="162" text-anchor="middle" font-size="18">目标图像 Iɡ</text>
    <rect x="355" y="52" width="150" height="55" rx="4" fill="#eef4f7" stroke="#627986" stroke-width="1.5"/>
    <text x="430" y="86" text-anchor="middle" font-size="18">LeWM 编码器 E</text>
    <rect x="355" y="128" width="150" height="55" rx="4" fill="#eef4f7" stroke="#627986" stroke-width="1.5"/>
    <text x="430" y="162" text-anchor="middle" font-size="18">同一个编码器 E</text>
    <rect x="570" y="52" width="125" height="55" rx="4" fill="#fff" stroke="#627986" stroke-width="1.5"/>
    <text x="632.5" y="86" text-anchor="middle" font-size="18">当前 zₜ</text>
    <rect x="570" y="128" width="125" height="55" rx="4" fill="#fff" stroke="#627986" stroke-width="1.5"/>
    <text x="632.5" y="162" text-anchor="middle" font-size="18">目标 zɡ</text>

    <rect x="85" y="256" width="220" height="72" rx="4" fill="#fff7eb" stroke="#a87946" stroke-width="1.5"/>
    <text x="195" y="283" text-anchor="middle" font-size="18">CEM 提出一批动作序列</text>
    <text x="195" y="310" text-anchor="middle" font-size="16">每条都含未来若干步</text>
    <rect x="410" y="256" width="205" height="72" rx="4" fill="#eaf2eb" stroke="#607665" stroke-width="1.5"/>
    <text x="512.5" y="283" text-anchor="middle" font-size="18">固定的 LeWM 预测器</text>
    <text x="512.5" y="310" text-anchor="middle" font-size="16">逐步预测未来特征</text>
    <rect x="715" y="256" width="170" height="72" rx="4" fill="#fff" stroke="#627986" stroke-width="1.5"/>
    <text x="800" y="283" text-anchor="middle" font-size="18">预测终点特征</text>
    <text x="800" y="310" text-anchor="middle" font-size="17">ẑₜ₊H</text>
    <rect x="975" y="256" width="185" height="72" rx="4" fill="#fff7eb" stroke="#a87946" stroke-width="1.5"/>
    <text x="1067.5" y="283" text-anchor="middle" font-size="18">计算目标距离</text>
    <text x="1067.5" y="310" text-anchor="middle" font-size="16">比较 ẑₜ₊H 与 zɡ</text>

    <path d="M290 79 H355 M290 155 H355 M505 79 H570 M505 155 H570" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#a)"/>
    <path d="M632 107 V217 H512 V256" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#a)"/>
    <path d="M305 292 H410 M615 292 H715 M885 292 H975" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#a)"/>
    <path d="M695 155 H1067 V256" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#a)"/>
    <path d="M1067 328 V390 H195 V328" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#a)"/>
    <text x="640" y="381" text-anchor="middle" font-size="16" fill="#536875">保留较好候选，缩小下一轮采样范围；模型参数保持不变</text>
    <text x="600" y="437" text-anchor="middle" font-size="17" fill="#536875">搜索结束后只执行计划前段，再由新画面开始下一轮</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="475" viewBox="0 0 1100 475" role="img" aria-label="LeWM 动作条件 JEPA 训练架构：预测未来特征与防止表征坍缩">
  <title>LeWM 的动作条件表征预测训练</title>
  <defs>
    <marker id="arrow15" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#516675"/>
    </marker>
  </defs>
  <rect width="1100" height="475" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif" fill="#243746">
    <text x="40" y="34" font-size="22" font-weight="600">已知当前图像与动作，预测真实未来图像的特征</text>
    <text x="40" y="222" font-size="17" fill="#516675">真实未来只用于训练；实际预测时没有下面这条答案路径</text>
    <text x="555" y="462" text-anchor="middle" font-size="17" fill="#516675">训练依据两项误差更新视觉编码器 E 和动作预测器 P</text>

    <rect x="40" y="77" width="120" height="64" rx="5" fill="#edf3f6" stroke="#516675" stroke-width="1.5"/>
    <text x="100" y="116" text-anchor="middle" font-size="19">当前图像 Iₜ</text>
    <rect x="220" y="77" width="150" height="64" rx="5" fill="#edf3f6" stroke="#516675" stroke-width="1.5"/>
    <text x="295" y="116" text-anchor="middle" font-size="19">编码器 E</text>
    <rect x="430" y="77" width="110" height="64" rx="5" fill="#edf3f6" stroke="#516675" stroke-width="1.5"/>
    <text x="485" y="116" text-anchor="middle" font-size="19">当前 zₜ</text>
    <rect x="610" y="77" width="190" height="64" rx="5" fill="#e9f0e9" stroke="#607665" stroke-width="1.5"/>
    <text x="705" y="105" text-anchor="middle" font-size="19">动作条件预测器 P</text>
    <text x="705" y="130" text-anchor="middle" font-size="16">读入当前特征与动作</text>
    <rect x="860" y="77" width="190" height="64" rx="5" fill="#e9f0e9" stroke="#607665" stroke-width="1.5"/>
    <text x="955" y="116" text-anchor="middle" font-size="19">预测未来特征 ẑₜ₊₁</text>
    <rect x="610" y="160" width="190" height="47" rx="5" fill="#fff8ed" stroke="#a97843" stroke-width="1.5"/>
    <text x="705" y="190" text-anchor="middle" font-size="18">实际动作 aₜ</text>

    <rect x="40" y="262" width="120" height="64" rx="5" fill="#edf3f6" stroke="#516675" stroke-width="1.5"/>
    <text x="100" y="301" text-anchor="middle" font-size="19">未来图像 Iₜ₊₁</text>
    <rect x="220" y="262" width="150" height="64" rx="5" fill="#edf3f6" stroke="#516675" stroke-width="1.5"/>
    <text x="295" y="301" text-anchor="middle" font-size="19">同一个 E</text>
    <rect x="430" y="262" width="110" height="64" rx="5" fill="#edf3f6" stroke="#516675" stroke-width="1.5"/>
    <text x="485" y="301" text-anchor="middle" font-size="19">答案 zₜ₊₁</text>
    <rect x="860" y="262" width="190" height="64" rx="5" fill="#fff8ed" stroke="#a97843" stroke-width="1.5"/>
    <text x="955" y="289" text-anchor="middle" font-size="18">① 预测误差</text>
    <text x="955" y="314" text-anchor="middle" font-size="16">ẑ 与真实 z 比较</text>
    <rect x="610" y="375" width="190" height="62" rx="5" fill="#fff8ed" stroke="#a97843" stroke-width="1.5"/>
    <text x="705" y="400" text-anchor="middle" font-size="18">② SIGReg 约束</text>
    <text x="705" y="425" text-anchor="middle" font-size="16">检查整批特征分布</text>
    <rect x="860" y="375" width="190" height="62" rx="5" fill="#f3f6f8" stroke="#516675" stroke-width="1.5"/>
    <text x="955" y="413" text-anchor="middle" font-size="19">① + λ × ②</text>
  </g>
  <g fill="none" stroke="#516675" stroke-width="2" marker-end="url(#arrow15)">
    <path d="M160 109 H220"/>
    <path d="M370 109 H430"/>
    <path d="M540 109 H610"/>
    <path d="M800 109 H860"/>
    <path d="M705 160 V141"/>
    <path d="M160 294 H220"/>
    <path d="M370 294 H430"/>
    <path d="M540 294 H860"/>
    <path d="M955 141 V262"/>
    <path d="M485 326 V406 H610"/>
    <path d="M955 326 V375"/>
    <path d="M800 406 H860"/>
  </g>
</svg>

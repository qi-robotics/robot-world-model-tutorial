<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="505" viewBox="0 0 1100 505" role="img" aria-label="LeWM 预测误差读取预测特征与真实未来特征，SIGReg 仅读取批次内真实图像的编码特征">
  <title>LeWM 的两项训练约束及各自输入</title>
  <defs>
    <marker id="arrow15" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#526775"/>
    </marker>
  </defs>
  <rect width="1100" height="505" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif" fill="#243746">
    <text x="30" y="34" font-size="22" font-weight="600">① 预测误差：比较预测的未来与真实未来</text>
    <rect x="30" y="72" width="155" height="64" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="107" y="110" text-anchor="middle" font-size="18">当前图像 Iₜ</text>
    <rect x="235" y="72" width="140" height="64" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="305" y="110" text-anchor="middle" font-size="18">编码器 E</text>
    <rect x="425" y="72" width="135" height="64" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="492" y="110" text-anchor="middle" font-size="18">当前特征 zₜ</text>
    <rect x="610" y="72" width="190" height="64" rx="4" fill="#eaf2ed" stroke="#607766" stroke-width="1.5"/>
    <text x="705" y="110" text-anchor="middle" font-size="18">动作预测器 P</text>
    <rect x="850" y="72" width="220" height="64" rx="4" fill="#eaf2ed" stroke="#607766" stroke-width="1.5"/>
    <text x="960" y="110" text-anchor="middle" font-size="18">预测特征 ẑₜ₊₁</text>
    <rect x="610" y="155" width="190" height="48" rx="4" fill="#fff7ec" stroke="#a77947" stroke-width="1.5"/>
    <text x="705" y="185" text-anchor="middle" font-size="17">实际动作 aₜ</text>
    <rect x="30" y="222" width="155" height="64" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="107" y="260" text-anchor="middle" font-size="18">未来图像 Iₜ₊₁</text>
    <rect x="235" y="222" width="140" height="64" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="305" y="260" text-anchor="middle" font-size="18">同一个 E</text>
    <rect x="425" y="222" width="135" height="64" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="492" y="260" text-anchor="middle" font-size="18">真实特征 zₜ₊₁</text>
    <rect x="850" y="222" width="220" height="64" rx="4" fill="#fff7ec" stroke="#a77947" stroke-width="1.5"/>
    <text x="960" y="260" text-anchor="middle" font-size="18">预测误差</text>
    <text x="30" y="337" font-size="22" font-weight="600">② SIGReg：只检查真实图像的编码特征</text>
    <rect x="30" y="360" width="240" height="82" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="150" y="392" text-anchor="middle" font-size="17">批次内各轨迹、各时刻</text>
    <text x="150" y="421" text-anchor="middle" font-size="17">的真实图像</text>
    <rect x="320" y="360" width="165" height="82" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="402" y="407" text-anchor="middle" font-size="18">同一个编码器 E</text>
    <rect x="535" y="360" width="220" height="82" rx="4" fill="#edf3f6" stroke="#526775" stroke-width="1.5"/>
    <text x="645" y="392" text-anchor="middle" font-size="18">编码特征集合 Z</text>
    <text x="645" y="421" text-anchor="middle" font-size="15" fill="#526775">含当前帧和真实未来帧</text>
    <rect x="805" y="360" width="265" height="82" rx="4" fill="#fff7ec" stroke="#a77947" stroke-width="1.5"/>
    <text x="937" y="392" text-anchor="middle" font-size="18">SIGReg</text>
    <text x="937" y="421" text-anchor="middle" font-size="16">随机方向上的分布检查</text>
    <text x="30" y="482" font-size="16" fill="#526775">训练把两项误差相加；预测特征只用于①，不进入②。</text>
  </g>
  <g fill="none" stroke="#526775" stroke-width="2" marker-end="url(#arrow15)">
    <path d="M185 104 H235"/>
    <path d="M375 104 H425"/>
    <path d="M560 104 H610"/>
    <path d="M800 104 H850"/>
    <path d="M705 155 V136"/>
    <path d="M185 254 H235"/>
    <path d="M375 254 H425"/>
    <path d="M560 254 H850"/>
    <path d="M960 136 V222"/>
    <path d="M270 401 H320"/>
    <path d="M485 401 H535"/>
    <path d="M755 401 H805"/>
  </g>
</svg>

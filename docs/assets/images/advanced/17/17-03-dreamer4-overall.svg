<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Dreamer 4 总体架构与数据流">
  <title>Dreamer 4 总体架构与数据流</title>
  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#526773"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3f718e"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif">
    <text x="600" y="36" text-anchor="middle" fill="#243746" font-size="24" font-weight="600">Dreamer 4：世界生成路径与任务学习路径</text>

    <rect x="20" y="62" width="1160" height="370" rx="6" fill="#f7fafb" stroke="#aab9c1" stroke-width="1.5"/>
    <text x="42" y="92" fill="#38586b" font-size="18" font-weight="600">第一阶段：训练视觉世界模型，给定历史和动作生成下一视觉表示</text>

    <rect x="42" y="126" width="150" height="86" rx="4" fill="#ffffff" stroke="#607985" stroke-width="1.5"/>
    <text x="117" y="160" text-anchor="middle" fill="#243746" font-size="18">过去与当前画面</text>
    <text x="117" y="189" text-anchor="middle" fill="#38586b" font-size="18">o₀ … oₜ</text>

    <path d="M192,169 L230,169" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <rect x="230" y="126" width="185" height="86" rx="4" fill="#edf4f7" stroke="#607985" stroke-width="1.5"/>
    <text x="322.5" y="158" text-anchor="middle" fill="#243746" font-size="18">因果视频编码器</text>
    <text x="322.5" y="187" text-anchor="middle" fill="#38586b" font-size="17">画面 → 连续表示</text>

    <path d="M415,169 L455,169" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <rect x="455" y="126" width="145" height="86" rx="4" fill="#ffffff" stroke="#607985" stroke-width="1.5"/>
    <text x="527.5" y="158" text-anchor="middle" fill="#243746" font-size="18">历史表示</text>
    <text x="527.5" y="188" text-anchor="middle" fill="#38586b" font-size="18">z₀ … zₜ</text>

    <path d="M600,169 L680,169" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <rect x="680" y="112" width="245" height="114" rx="4" fill="#eaf3ee" stroke="#557565" stroke-width="1.7"/>
    <text x="802.5" y="148" text-anchor="middle" fill="#243746" font-size="18" font-weight="600">交互动力学 Transformer</text>
    <text x="802.5" y="178" text-anchor="middle" fill="#38586b" font-size="17">综合历史、动作与生成状态</text>
    <text x="802.5" y="204" text-anchor="middle" fill="#38586b" font-size="17">估计干净的下一帧表示</text>

    <path d="M925,169 L975,169" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <rect x="975" y="126" width="170" height="86" rx="4" fill="#ffffff" stroke="#607985" stroke-width="1.5"/>
    <text x="1060" y="158" text-anchor="middle" fill="#243746" font-size="18">预测未来表示</text>
    <text x="1060" y="188" text-anchor="middle" fill="#38586b" font-size="18">ẑₜ₊₁</text>

    <rect x="630" y="284" width="340" height="92" rx="4" fill="#ffffff" stroke="#607985" stroke-width="1.5"/>
    <text x="800" y="313" text-anchor="middle" fill="#243746" font-size="18">本次生成还要输入</text>
    <text x="800" y="342" text-anchor="middle" fill="#38586b" font-size="17">带噪未来表示　实际动作 aₜ</text>
    <text x="800" y="366" text-anchor="middle" fill="#38586b" font-size="17">生成进度 τ　更新步长 d</text>
    <path d="M802,284 L802,226" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <path d="M1060,212 L1060,270" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>
    <rect x="1008" y="270" width="104" height="54" rx="4" fill="#ffffff" stroke="#607985" stroke-width="1.5"/>
    <text x="1060" y="303" text-anchor="middle" fill="#243746" font-size="17">解码器</text>
    <path d="M1060,324 L1060,352" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>
    <rect x="976" y="352" width="168" height="50" rx="4" fill="#ffffff" stroke="#607985" stroke-width="1.5"/>
    <text x="1060" y="383" text-anchor="middle" fill="#243746" font-size="17">还原未来画面</text>
    <text x="952" y="420" text-anchor="middle" fill="#526773" font-size="15">解码用于重建与查看；动力学在表示空间工作</text>

    <rect x="20" y="456" width="1160" height="238" rx="6" fill="#fbfaf6" stroke="#c8b894" stroke-width="1.5"/>
    <text x="42" y="486" fill="#705f37" font-size="18" font-weight="600">第二阶段加入策略头、奖励头；第三阶段再加入价值头</text>

    <rect x="270" y="528" width="175" height="78" rx="4" fill="#ffffff" stroke="#8a7851" stroke-width="1.5"/>
    <text x="357.5" y="558" text-anchor="middle" fill="#243746" font-size="18">任务信息</text>
    <text x="357.5" y="586" text-anchor="middle" fill="#705f37" font-size="16">如任务标识</text>

    <path d="M445,567 L510,567" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <rect x="510" y="514" width="230" height="106" rx="4" fill="#f7f0df" stroke="#8a7851" stroke-width="1.7"/>
    <text x="625" y="551" text-anchor="middle" fill="#243746" font-size="19" font-weight="600">agent token</text>
    <text x="625" y="580" text-anchor="middle" fill="#705f37" font-size="16">读取世界特征和任务信息</text>
    <text x="625" y="605" text-anchor="middle" fill="#705f37" font-size="16">形成任务相关表示</text>

    <path d="M527,212 L527,472 L625,472 L625,514" fill="none" stroke="#3f718e" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <rect x="536" y="452" width="245" height="28" fill="#fbfaf6"/>
    <text x="658.5" y="472" text-anchor="middle" fill="#3f718e" font-size="16">当前世界特征单向提供给 agent token</text>

    <path d="M740,537 L810,518" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>
    <path d="M740,567 L810,567" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>
    <path d="M740,597 L810,616" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <path d="M1125,518 L1158,518 L1158,438 L990,438 L990,330 L970,330" fill="none" stroke="#3f718e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>

    <rect x="810" y="491" width="315" height="54" rx="4" fill="#ffffff" stroke="#8a7851" stroke-width="1.5"/>
    <text x="967.5" y="524" text-anchor="middle" fill="#243746" font-size="18">策略头：输出下一动作的分布</text>
    <rect x="810" y="551" width="315" height="54" rx="4" fill="#ffffff" stroke="#8a7851" stroke-width="1.5"/>
    <text x="967.5" y="584" text-anchor="middle" fill="#243746" font-size="18">奖励头：预测当前任务的奖励</text>
    <rect x="810" y="611" width="315" height="54" rx="4" fill="#ffffff" stroke="#8a7851" stroke-width="1.5"/>
    <text x="967.5" y="644" text-anchor="middle" fill="#243746" font-size="18">价值头：估计后续累计奖励</text>

    <text x="65" y="543" fill="#526773" font-size="16">想象训练时：</text>
    <text x="65" y="570" fill="#526773" font-size="16">策略采样动作</text>
    <text x="65" y="596" fill="#526773" font-size="16">→ 动作进入动力学</text>
    <text x="65" y="622" fill="#526773" font-size="16">→ 生成新的世界表示</text>
    <text x="65" y="648" fill="#526773" font-size="16">→ 再次选择动作</text>
  </g>
</svg>

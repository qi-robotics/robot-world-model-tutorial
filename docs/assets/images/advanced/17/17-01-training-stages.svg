<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="Dreamer 4 三阶段数据流"><title>Dreamer 4 三阶段数据流</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536875"/></marker></defs><rect width="1000" height="350" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif"><text x="500" y="32" text-anchor="middle" fill="#243746" font-size="23">从预测画面，到学习怎样行动</text><rect x="25" y="95" width="270" height="110" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="160" y="130" text-anchor="middle" fill="#243746" font-size="20">① 视觉世界模型</text><text x="160" y="157" text-anchor="middle" fill="#243746" font-size="20">视频编码 + 动作条件预测</text><text x="160" y="184" text-anchor="middle" fill="#243746" font-size="20">监督：记录中的后续画面</text><path d="M295,150 L360,150" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="95" width="280" height="110" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="500" y="130" text-anchor="middle" fill="#243746" font-size="20">② 任务适配</text><text x="500" y="157" text-anchor="middle" fill="#243746" font-size="20">接入策略与奖励输出</text><text x="500" y="184" text-anchor="middle" fill="#243746" font-size="20">监督：记录动作与任务奖励</text><path d="M640,150 L705,150" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="705" y="95" width="270" height="110" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="840" y="130" text-anchor="middle" fill="#243746" font-size="20">③ 想象训练</text><text x="840" y="157" text-anchor="middle" fill="#243746" font-size="20">改进策略与价值头</text><text x="840" y="184" text-anchor="middle" fill="#243746" font-size="20">经验：模型生成的交互</text><text x="160" y="260" text-anchor="middle" fill="#243746" font-size="18">编码器与动力学学习</text><text x="500" y="260" text-anchor="middle" fill="#243746" font-size="18">仍保留视觉预测目标</text><text x="840" y="260" text-anchor="middle" fill="#243746" font-size="18">默认固定 Transformer</text><text x="500" y="318" text-anchor="middle" fill="#243746" font-size="18">任务适配之前的世界预测，与适配之后的行为选择，不能混为一个目标</text></g></svg>

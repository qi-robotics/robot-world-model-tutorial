<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="395" viewBox="0 0 1100 395" role="img" aria-label="UWM三种推理方式中动作和未来视觉支路的角色">
  <title>三种推理接口</title>
  <rect width="1100" height="395" fill="#fff"/>
  <g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif" fill="#243746">
    <text x="36" y="42" font-size="23" font-weight="600">同一共享模型，不同的“已知 / 要生成”设置</text>
    <text x="558" y="43" font-size="15" fill="#536575">各列表示角色，不表示先后步骤</text>
    <text x="41" y="98" font-size="18" font-weight="600">策略：求动作</text>
    <text x="41" y="200" font-size="18" font-weight="600">正向：求后果</text>
    <text x="41" y="302" font-size="18" font-weight="600">逆向：求动作</text>
    <rect x="240" y="63" width="173" height="65" rx="6" fill="#eef3f6" stroke="#677b89"/><text x="327" y="103" text-anchor="middle" font-size="17">当前观测</text>
    <rect x="459" y="63" width="206" height="65" rx="6" fill="#fff4e4" stroke="#aa7b48"/><text x="562" y="103" text-anchor="middle" font-size="17">动作：从噪声生成</text>
    <rect x="733" y="63" width="323" height="65" rx="6" fill="#f1f3f4" stroke="#aeb9bf"/><text x="895" y="103" text-anchor="middle" font-size="17">未来：完全噪声占位</text>
    <rect x="240" y="165" width="173" height="65" rx="6" fill="#eef3f6" stroke="#677b89"/><text x="327" y="205" text-anchor="middle" font-size="17">当前观测</text>
    <rect x="459" y="165" width="206" height="65" rx="6" fill="#e7eff5" stroke="#607b92"/><text x="562" y="205" text-anchor="middle" font-size="17">动作：已给定</text>
    <rect x="733" y="165" width="323" height="65" rx="6" fill="#fff4e4" stroke="#aa7b48"/><text x="895" y="205" text-anchor="middle" font-size="17">未来：从噪声生成</text>
    <rect x="240" y="267" width="173" height="65" rx="6" fill="#eef3f6" stroke="#677b89"/><text x="327" y="307" text-anchor="middle" font-size="17">当前观测</text>
    <rect x="459" y="267" width="206" height="65" rx="6" fill="#fff4e4" stroke="#aa7b48"/><text x="562" y="307" text-anchor="middle" font-size="17">动作：从噪声生成</text>
    <rect x="733" y="267" width="323" height="65" rx="6" fill="#e7eff5" stroke="#607b92"/><text x="895" y="307" text-anchor="middle" font-size="17">未来：已给定画面</text>
    <text x="41" y="373" font-size="16" fill="#536575">橙色：逐步生成　蓝色：已知条件　浅灰：不生成，仅占位</text>
  </g>
</svg>

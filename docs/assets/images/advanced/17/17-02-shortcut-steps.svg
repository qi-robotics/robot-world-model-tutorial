<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="两小步指导一大步"><title>两小步指导一大步</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536875"/></marker></defs><rect width="1000" height="330" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif"><text x="500" y="30" text-anchor="middle" fill="#243746" font-size="23">这里是生成进度，不是物理时间</text><text x="40" y="105" text-anchor="start" fill="#243746" font-size="18">两次半步</text><circle cx="230" cy="100" r="7" fill="#497f99" stroke="#354955" stroke-width="1.2"/><circle cx="550" cy="100" r="7" fill="#497f99" stroke="#354955" stroke-width="1.2"/><circle cx="900" cy="100" r="7" fill="#497f99" stroke="#354955" stroke-width="1.2"/><path d="M238,100 L542,100" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M558,100 L892,100" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="78" text-anchor="middle" fill="#243746" font-size="18">步长 d/2</text><text x="735" y="78" text-anchor="middle" fill="#243746" font-size="18">步长 d/2</text><text x="230" y="140" text-anchor="middle" fill="#243746" font-size="18">当前表示</text><text x="550" y="140" text-anchor="middle" fill="#243746" font-size="18">中间点：重新查询网络</text><text x="900" y="140" text-anchor="middle" fill="#243746" font-size="18">两步终点</text><text x="40" y="240" text-anchor="start" fill="#243746" font-size="18">一次大步</text><circle cx="230" cy="235" r="7" fill="#b67d4c" stroke="#354955" stroke-width="1.2"/><circle cx="900" cy="235" r="7" fill="#b67d4c" stroke="#354955" stroke-width="1.2"/><path d="M238,235 L892,235" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="215" text-anchor="middle" fill="#243746" font-size="18">步长 d：学习上方两步的平均方向</text><path d="M900,155 L900,218" fill="none" stroke="#536875" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="500" y="298" text-anchor="middle" fill="#243746" font-size="18">小步目标停止梯度；大步输出学习与两小步一致</text></g></svg>

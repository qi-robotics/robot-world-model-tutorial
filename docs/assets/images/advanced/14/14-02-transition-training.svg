<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="区间动作与前后状态对齐"><title>区间动作与前后状态对齐</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536875"/></marker></defs><rect width="1000" height="350" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif"><text x="500" y="30" text-anchor="middle" fill="#243746" font-size="23">先对齐记录，再计算预测误差</text><rect x="30" y="75" width="200" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="130" y="114.5" text-anchor="middle" fill="#243746" font-size="20">执行前状态 sₜ</text><rect x="400" y="75" width="200" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="500" y="114.5" text-anchor="middle" fill="#243746" font-size="20">实际动作 aₜ</text><rect x="770" y="75" width="200" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="870" y="114.5" text-anchor="middle" fill="#243746" font-size="20">执行后状态 sₜ₊₁</text><path d="M230,107 L400,107" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M600,107 L770,107" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M130,140 L130,235" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M500,140 L500,235" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="235" width="550" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="315" y="274.5" text-anchor="middle" fill="#243746" font-size="20">输入状态与动作 → 预测器 → 下一状态预测</text><path d="M590,267 L770,267" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M870,140 L870,235" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="235" width="200" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="870" y="274.5" text-anchor="middle" fill="#243746" font-size="20">预测与答案的误差</text><text x="870" y="326" text-anchor="middle" fill="#243746" font-size="17">更新预测器参数</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="真实输入与连续预测的区别"><title>真实输入与连续预测的区别</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536875"/></marker></defs><rect width="1000" height="360" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif"><text x="500" y="32" text-anchor="middle" fill="#243746" font-size="23">检查一步，与检查一段，是两种评测</text><text x="20" y="95" text-anchor="start" fill="#243746" font-size="18">逐步给真实输入</text><rect x="210" y="65" width="200" height="60" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="310" y="102" text-anchor="middle" fill="#243746" font-size="20">真实状态 sₜ</text><path d="M410,95 L500,95" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="65" width="210" height="60" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="605" y="102" text-anchor="middle" fill="#243746" font-size="20">F 与动作 aₜ</text><path d="M710,95 L790,95" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="65" width="180" height="60" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="880" y="102" text-anchor="middle" fill="#243746" font-size="20">预测下一状态</text><text x="500" y="161" text-anchor="middle" fill="#243746" font-size="17">下一步重新读取真实状态，单步误差不会作为输入传下去</text><text x="20" y="244" text-anchor="start" fill="#243746" font-size="18">只在起点观察</text><rect x="210" y="210" width="150" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="285" y="249.5" text-anchor="middle" fill="#243746" font-size="20">真实起点</text><path d="M360,242 L430,242" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="210" width="220" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="540" y="249.5" text-anchor="middle" fill="#243746" font-size="20">预测状态 1</text><path d="M650,242 L720,242" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="210" width="250" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="845" y="249.5" text-anchor="middle" fill="#243746" font-size="20">用预测状态 1 预测状态 2</text><text x="575" y="319" text-anchor="middle" fill="#243746" font-size="18">每条箭头都包含一次 F 计算与该区间的动作</text></g></svg>

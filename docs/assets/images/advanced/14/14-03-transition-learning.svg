<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">动作条件状态转移模型的一次训练更新</title>
  <desc id="desc">执行前状态与实际动作成为三维输入，小型网络预测两个位置变化量；预测变化与执行后记录形成的答案比较，误差更新网络参数。预测变化加回起点得到下一状态。</desc>
  <defs>
    <style>
      .heading{font:700 24px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .section{font:700 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:16px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
      .input{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .model{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .compare{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .result{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .loss{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}
      .arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrowhead)}
      .back{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#backhead)}
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="9" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L0 7L9 3.5z" fill="#475569"/></marker>
    <marker id="backhead" markerWidth="9" markerHeight="7" refX="9" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L0 7L9 3.5z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1100" height="460" fill="#fff"/>
  <text x="550" y="42" text-anchor="middle" class="heading">执行前状态 + 实际动作 → 预测变化 → 与执行后记录核对</text>

  <rect x="25" y="100" width="215" height="210" rx="9" class="input"/>
  <text x="132" y="135" text-anchor="middle" class="section">训练输入 x</text>
  <text x="132" y="169" text-anchor="middle" class="body">推杆位置 0.21 m</text>
  <text x="132" y="199" text-anchor="middle" class="body">物体位置 0.25 m</text>
  <text x="132" y="229" text-anchor="middle" class="body">实际动作 +0.04 m</text>
  <text x="132" y="279" text-anchor="middle" class="small">执行前可获得的 3 个数</text>

  <rect x="295" y="100" width="225" height="210" rx="9" class="model"/>
  <text x="407" y="135" text-anchor="middle" class="section">状态转移网络</text>
  <text x="407" y="171" text-anchor="middle" class="body">先按训练统计量归一化</text>
  <text x="407" y="207" text-anchor="middle" class="body">3 → 32 → 32 → 2</text>
  <text x="407" y="245" text-anchor="middle" class="small">线性层、ReLU、线性输出</text>
  <text x="407" y="279" text-anchor="middle" class="small">参数由训练误差更新</text>

  <rect x="575" y="100" width="255" height="210" rx="9" class="compare"/>
  <text x="702" y="135" text-anchor="middle" class="section">网络输出：预测变化</text>
  <text x="702" y="181" text-anchor="middle" class="body">(+0.03, 0) m</text>
  <text x="702" y="237" text-anchor="middle" class="small">推杆与物体各一个数</text>
  <text x="702" y="272" text-anchor="middle" class="small">这里只依赖执行前输入</text>

  <rect x="885" y="100" width="190" height="210" rx="9" class="result"/>
  <text x="980" y="135" text-anchor="middle" class="section">下一状态预测</text>
  <text x="980" y="178" text-anchor="middle" class="body">起点 + 预测变化</text>
  <text x="980" y="221" text-anchor="middle" class="body">(0.24, 0.25) m</text>
  <text x="980" y="277" text-anchor="middle" class="small">使用时只需前向计算</text>

  <path d="M240 205H288" class="arrow"/>
  <path d="M520 205H568" class="arrow"/>
  <path d="M830 205H878" class="arrow"/>

  <rect x="575" y="339" width="255" height="65" rx="9" class="loss"/>
  <text x="702" y="367" text-anchor="middle" class="section">两个位移分量的误差</text>
  <text x="702" y="391" text-anchor="middle" class="small">比较预测与执行后答案</text>
  <rect x="885" y="339" width="190" height="65" rx="9" class="compare"/>
  <text x="980" y="367" text-anchor="middle" class="section">真实变化答案</text>
  <text x="980" y="391" text-anchor="middle" class="small">(+0.04, +0.025) m</text>
  <path d="M702 310V332" class="arrow"/>
  <path d="M885 372H837" class="arrow"/>
  <path d="M575 372H407V317" class="back"/>
  <text x="420" y="439" text-anchor="middle" class="small">训练时，误差反向更新网络参数；预测时不更新</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="相同状态，不同动作，不同后果"><title>相同状态，不同动作，不同后果</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536875"/></marker></defs><rect width="1000" height="330" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,sans-serif"><text x="500" y="30" text-anchor="middle" fill="#243746" font-size="23">动作是世界预测的输入</text><rect x="25" y="130" width="180" height="65" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="115" y="156" text-anchor="middle" fill="#243746" font-size="20">同一当前状态</text><text x="115" y="183" text-anchor="middle" fill="#243746" font-size="20">推杆在物体左侧</text><path d="M205,145 L290,95" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M205,180 L290,255" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="60" width="180" height="70" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="380" y="102" text-anchor="middle" fill="#243746" font-size="20">动作 A：向右靠近</text><rect x="290" y="220" width="180" height="70" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="380" y="262" text-anchor="middle" fill="#243746" font-size="20">动作 B：向左离开</text><path d="M470,95 L550,95" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M470,255 L550,255" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="60" width="180" height="70" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="640" y="102" text-anchor="middle" fill="#243746" font-size="20">世界模型 F</text><rect x="550" y="220" width="180" height="70" rx="3" fill="#f3f6f8" stroke="#536875" stroke-width="1.5"/><text x="640" y="262" text-anchor="middle" fill="#243746" font-size="20">同一个 F</text><path d="M730,95 L810,95" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><path d="M730,255 L810,255" fill="none" stroke="#536875" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="60" width="170" height="70" rx="3" fill="#edf4f6" stroke="#536875" stroke-width="1.5"/><text x="895" y="102" text-anchor="middle" fill="#243746" font-size="20">可能接触并推动</text><rect x="810" y="220" width="170" height="70" rx="3" fill="#edf4f6" stroke="#536875" stroke-width="1.5"/><text x="895" y="262" text-anchor="middle" fill="#243746" font-size="20">物体可能不动</text></g></svg>

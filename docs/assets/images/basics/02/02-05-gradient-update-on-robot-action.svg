<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">梯度如何修正机械臂动作参数</title>
  <desc id="desc">机械臂向右移动不足时，负梯度使参数增大，下一次预测更接近示范动作。</desc>
  <rect width="1240" height="600" fill="#ffffff"/>
  <text x="620" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">梯度把“动作偏小”转化为参数调整方向</text>
  <rect x="55" y="105" width="390" height="390" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="250" y="145" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#334155">当前这个训练样本</text>
  <line x1="105" y1="325" x2="395" y2="325" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="165" cy="325" r="20" fill="#2563eb"/>
  <text x="165" y="372" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1e3a8a">末端起点</text>
  <line x1="185" y1="270" x2="285" y2="270" stroke="#f97316" stroke-width="8" marker-end="url(#arrowOrange)"/>
  <text x="235" y="246" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#c2410c">预测 +0.02 m</text>
  <line x1="185" y1="420" x2="360" y2="420" stroke="#16a34a" stroke-width="8" marker-end="url(#arrowGreen)"/>
  <text x="272" y="458" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#166534">示范 +0.04 m</text>
  <text x="250" y="198" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#0f172a">目标在右侧，但预测移动不足</text>
  <path d="M470 300 H545" stroke="#64748b" stroke-width="5" marker-end="url(#arrowGray)"/>
  <rect x="560" y="105" width="625" height="390" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="872" y="145" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">参数 w 与损失 L(w)</text>
  <line x1="650" y1="425" x2="1110" y2="425" stroke="#334155" stroke-width="3"/>
  <line x1="690" y1="185" x2="690" y2="455" stroke="#334155" stroke-width="3"/>
  <path d="M720 205 C800 420 960 420 1060 205" fill="none" stroke="#2563eb" stroke-width="7"/>
  <circle cx="790" cy="337" r="13" fill="#ef4444"/>
  <text x="768" y="315" text-anchor="end" font-family="sans-serif" font-size="19" fill="#991b1b">当前 w</text>
  <path d="M810 330 C850 355 882 365 925 368" fill="none" stroke="#f97316" stroke-width="6" marker-end="url(#arrowOrange)"/>
  <circle cx="940" cy="368" r="13" fill="#16a34a"/>
  <text x="958" y="353" font-family="sans-serif" font-size="19" fill="#166534">更新后的 w</text>
  <text x="872" y="470" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">w 增大 → 向右动作增大 → 更接近示范</text>
  <rect x="140" y="525" width="960" height="48" rx="12" fill="#fff7ed"/>
  <text x="620" y="557" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#9a3412">梯度很小可能表示已接近低损失，也可能来自激活饱和、尺度不当或样本梯度相互抵消，不能单独判断“已经学会”。</text>
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
</svg>

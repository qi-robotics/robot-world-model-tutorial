<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">线性关系与机器人需要的非线性动作关系</title>
  <desc id="desc">比较固定线性动作与包含远距离限速、近距离减速和到达后停止的非线性动作。</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">目标距离与末端动作并不总是简单的直线关系</text>
  <line x1="120" y1="330" x2="1090" y2="330" stroke="#334155" stroke-width="3"/>
  <line x1="600" y1="90" x2="600" y2="545" stroke="#334155" stroke-width="3"/>
  <text x="1090" y="550" text-anchor="end" font-family="sans-serif" font-size="21" fill="#334155">目标相对位置 rₓ</text>
  <text x="620" y="112" font-family="sans-serif" font-size="21" fill="#334155">动作 Δx</text>
  <text x="585" y="357" text-anchor="end" font-family="sans-serif" font-size="18" fill="#64748b">0</text>
  <path d="M170 500 L1030 160" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="13 11"/>
  <text x="940" y="155" font-family="sans-serif" font-size="20" fill="#64748b">单一线性关系</text>
  <path d="M170 440 C310 438 370 430 465 380 C515 350 545 330 570 330 L630 330 C655 330 685 310 735 280 C830 230 890 222 1030 220" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="600" cy="330" r="11" fill="#2563eb"/>
  <text x="205" y="475" font-family="sans-serif" font-size="20" fill="#1d4ed8">距离很远：向左动作限速</text>
  <text x="350" y="405" font-family="sans-serif" font-size="20" fill="#1d4ed8">接近目标：逐渐减速</text>
  <text x="616" y="365" font-family="sans-serif" font-size="20" fill="#1d4ed8">到达附近：停止</text>
  <text x="810" y="205" font-family="sans-serif" font-size="20" fill="#1d4ed8">距离很远：向右动作限速</text>
  <rect x="120" y="565" width="960" height="38" rx="10" fill="#eff6ff"/>
  <text x="600" y="591" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1e3a8a">隐藏层与非线性激活使网络能够在不同输入区域采用不同响应</text>
</svg>

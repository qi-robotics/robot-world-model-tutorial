<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">不同训练目标塑造不同视觉表征</title>
  <desc id="desc">同一幅桌面机器人图像分别用于分类、重建、对比和预测任务，各任务要求编码器保留不同信息。</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">同一幅图像，不同目标要求保留不同信息</text>

  <g transform="translate(55,135)">
    <rect width="300" height="330" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <text x="150" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">机器人看到的场景</text>
    <rect x="25" y="70" width="250" height="190" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="38" y="205" width="224" height="38" rx="6" fill="#d6b88c"/>
    <path d="M80 166h62v39H80z" fill="#ef4444"/>
    <path d="M91 142h40v28H91z" fill="#f87171"/>
    <path d="M198 145h50v60h-50z" fill="#3b82f6"/>
    <path d="M204 155h38v38h-38z" fill="#dbeafe"/>
    <text x="111" y="285" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b91c1c">红色杯子</text>
    <text x="223" y="285" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d4ed8">蓝色盒子</text>
    <text x="150" y="313" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">输入形状 [B,3,H,W]</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <path d="M375 202H455"/>
    <path d="M375 285H455"/>
    <path d="M375 368H455"/>
    <path d="M375 451H455"/>
  </g>

  <g transform="translate(475,135)" font-family="sans-serif">
    <g>
      <rect width="660" height="64" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="22" y="27" font-size="20" font-weight="700" fill="#1e3a8a">分类监督</text>
      <text x="160" y="27" font-size="18" fill="#334155">目标：是不是杯子</text>
      <text x="160" y="50" font-size="17" fill="#475569">优先保留类别和外观，未必保留精确位置</text>
    </g>
    <g transform="translate(0,83)">
      <rect width="660" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="22" y="27" font-size="20" font-weight="700" fill="#166534">重建学习</text>
      <text x="160" y="27" font-size="18" fill="#334155">目标：恢复输入或缺失部分</text>
      <text x="160" y="50" font-size="17" fill="#475569">需要外观与结构，也可能保存无关纹理</text>
    </g>
    <g transform="translate(0,166)">
      <rect width="660" height="64" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="22" y="27" font-size="20" font-weight="700" fill="#9a3412">对比学习</text>
      <text x="160" y="27" font-size="18" fill="#334155">目标：相关样本靠近，不相关样本分开</text>
      <text x="160" y="50" font-size="17" fill="#475569">保留由样本关系定义的共同信息</text>
    </g>
    <g transform="translate(0,249)">
      <rect width="660" height="64" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="22" y="27" font-size="20" font-weight="700" fill="#6d28d9">表示预测</text>
      <text x="160" y="27" font-size="18" fill="#334155">目标：由上下文预测目标区域表示</text>
      <text x="160" y="50" font-size="17" fill="#475569">倾向保留目标编码器中的可预测结构</text>
    </g>
  </g>

  <rect x="180" y="525" width="840" height="78" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="558" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">表征不是由网络名称单独决定</text>
  <text x="600" y="586" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">网络结构规定计算路径，数据与损失决定哪些信息值得保留</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>

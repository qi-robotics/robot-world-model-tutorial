<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">针孔相机把三维射线投影为二维像素</title>
  <desc id="desc">近点和远点位于同一成像射线上，因此投影到同一个像素，深度用于确定射线上的位置。</desc>
  <rect width="1200" height="620" fill="#fff"/>
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">像素确定方向，深度确定沿射线的位置</text>
  <g transform="translate(110,110)">
    <path d="M120 380L120 60M120 380L440 380M120 380L40 450" stroke="#334155" stroke-width="4"/>
    <text x="450" y="387" font-family="sans-serif" font-size="20" fill="#334155">z</text><text x="105" y="45" font-family="sans-serif" font-size="20" fill="#334155">y</text><text x="20" y="470" font-family="sans-serif" font-size="20" fill="#334155">x</text>
    <circle cx="120" cy="380" r="12" fill="#111827"/><text x="70" y="415" font-family="sans-serif" font-size="19" fill="#111827">相机光心</text>
    <line x1="120" y1="380" x2="600" y2="110" stroke="#f97316" stroke-width="5"/>
    <circle cx="330" cy="262" r="24" fill="#ef4444"/><text x="330" y="315" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#991b1b">近点</text>
    <circle cx="545" cy="141" r="31" fill="#ef4444" opacity=".65"/><text x="560" y="105" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#991b1b">远点</text>
    <line x1="245" y1="80" x2="245" y2="470" stroke="#2563eb" stroke-width="5"/>
    <circle cx="245" cy="310" r="11" fill="#7c3aed"/>
    <text x="245" y="55" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">像平面</text>
    <text x="265" y="345" font-family="sans-serif" font-size="19" fill="#6d28d9">同一像素 (u,v)</text>
  </g>
  <g transform="translate(790,150)">
    <rect width="300" height="260" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <path d="M50 210L150 50L250 210Z" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <circle cx="105" cy="138" r="18" fill="#ef4444"/><circle cx="195" cy="138" r="28" fill="#ef4444" opacity=".65"/>
    <text x="150" y="242" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">二维投影丢失沿射线距离</text>
  </g>
  <rect x="770" y="450" width="340" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="940" y="492" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">增加深度 d</text>
  <text x="940" y="524" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">才能从射线选择一个三维点</text>
</svg>

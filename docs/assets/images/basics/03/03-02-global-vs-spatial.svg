<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">全局视觉向量与空间视觉 token 的差异</title>
  <desc id="desc">左右互换的杯子场景经过全局汇总可能相似，空间 token 则保留区域和位置。</desc>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">“画面里有什么”与“它在哪里”需要不同接口</text>
  <g transform="translate(60,110)">
    <rect width="300" height="190" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <rect x="12" y="135" width="276" height="42" rx="8" fill="#d6b88c"/>
    <circle cx="85" cy="112" r="28" fill="#ef4444"/><rect x="205" y="82" width="58" height="58" rx="6" fill="#3b82f6"/>
    <text x="150" y="225" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#334155">场景 A：红杯在左</text>
  </g>
  <g transform="translate(60,385)">
    <rect width="300" height="190" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <rect x="12" y="135" width="276" height="42" rx="8" fill="#d6b88c"/>
    <rect x="55" y="82" width="58" height="58" rx="6" fill="#3b82f6"/><circle cx="225" cy="112" r="28" fill="#ef4444"/>
    <text x="150" y="225" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#334155">场景 B：红杯在右</text>
  </g>
  <path d="M390 205H480M390 480H480" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(500,120)">
    <text x="150" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">全局平均 → [B,D]</text>
    <rect x="20" y="40" width="260" height="90" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <g fill="#2563eb"><rect x="48" y="70" width="16" height="35"/><rect x="77" y="61" width="16" height="44"/><rect x="106" y="78" width="16" height="27"/><rect x="135" y="53" width="16" height="52"/><rect x="164" y="68" width="16" height="37"/><rect x="193" y="58" width="16" height="47"/><rect x="222" y="73" width="16" height="32"/></g>
    <text x="150" y="165" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">两个场景都含红杯和蓝盒</text>
    <text x="150" y="195" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#b91c1c">空间顺序可能被汇总</text>
  </g>
  <g transform="translate(830,120)">
    <text x="145" y="0" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#6d28d9">空间 token → [B,N,D]</text>
    <g stroke="#7c3aed" stroke-width="2"><rect x="25" y="40" width="240" height="160" fill="#f5f3ff"/><path d="M85 40V200M145 40V200M205 40V200M25 80H265M25 120H265M25 160H265"/></g>
    <circle cx="85" cy="140" r="14" fill="#ef4444"/><rect x="202" y="82" width="28" height="28" fill="#3b82f6"/>
    <text x="145" y="235" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">每个 token 对应一个区域</text>
    <text x="145" y="265" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#166534">仍可回答左右与相邻关系</text>
  </g>
  <path d="M800 205H830" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <rect x="470" y="440" width="670" height="130" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="805" y="480" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">从下游问题反推输出形状</text>
  <text x="805" y="520" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#334155">分类：全局向量常已足够　　定位 / grounding / 预测：保留空间索引</text>
  <text x="805" y="552" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#334155">压缩不是目的；保留完成机器人任务所需的信息才是目的</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
</svg>

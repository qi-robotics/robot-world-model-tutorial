<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
  <title id="title">多模态观测到安全动作的接口</title><desc id="desc">视觉、语言、本体和触觉进入策略，规范化动作经过尺度恢复、安全限制和控制器后作用于机器人并形成反馈。</desc>
  <defs><style>.title{font:700 20px sans-serif;fill:#172033}.text{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.safe{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
  <rect width="1040" height="410" rx="22" fill="#fff"/><text x="40" y="44" class="title">数组形状只是开始，物理语义必须贯穿整个闭环</text>
  <rect x="40" y="82" width="210" height="230" rx="16" class="box"/><text x="65" y="115" class="text">观测 oₜ</text><text x="65" y="153" class="small">视觉 / 深度</text><text x="65" y="184" class="small">语言目标</text><text x="65" y="215" class="small">关节 / 末端 / 夹爪</text><text x="65" y="246" class="small">力 / 触觉 / 接触</text><text x="65" y="282" class="small">时间戳 + valid mask</text>
  <path d="M260 196H323" class="arrow"/><rect x="334" y="114" width="175" height="164" rx="16" class="accent"/><text x="376" y="156" class="text">学习策略</text><text x="360" y="195" class="small">归一化状态</text><text x="360" y="225" class="small">→ 归一化动作 ãₜ</text>
  <path d="M520 196H583" class="arrow"/><rect x="594" y="100" width="190" height="192" rx="16" class="safe"/><text x="637" y="137" class="text">安全接口层</text><text x="620" y="174" class="small">反归一化</text><text x="620" y="203" class="small">坐标转换 / IK</text><text x="620" y="232" class="small">限幅 / 限速</text><text x="620" y="261" class="small">接触保护</text>
  <path d="M795 196H849" class="arrow"/><rect x="860" y="122" width="140" height="148" rx="16" class="box"/><text x="889" y="160" class="text">控制器</text><text x="885" y="197" class="small">执行 aₜ</text><text x="885" y="226" class="small">传感器反馈</text>
  <path d="M930 282V352H145V323" class="arrow"/><text x="427" y="378" class="small">命令不等于结果：执行后的测量重新进入下一轮观测</text>
</svg>

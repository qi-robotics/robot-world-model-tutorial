<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 式图文对齐流程</title>
  <desc id="desc">一批图像和配对文本分别经过视觉编码器与语言编码器，归一化表示组成相似度矩阵，对角配对由双向交叉熵共同优化。</desc>
  <defs>
    <style>
      .title{font:700 25px sans-serif;fill:#172033}.label{font:700 18px sans-serif;fill:#1e293b}.text{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.vision{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.language{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.loss{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect width="1120" height="570" fill="#ffffff"/>
  <text x="560" y="42" text-anchor="middle" class="title">图像和文字在共同空间中比较</text>

  <g transform="translate(35,82)">
    <rect width="210" height="170" rx="16" class="vision"/>
    <text x="105" y="31" text-anchor="middle" class="label" fill="#1d4ed8">一批图像</text>
    <rect x="22" y="50" width="72" height="46" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="58" cy="73" r="13" fill="#ef4444"/>
    <rect x="116" y="50" width="72" height="46" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="142" y="61" width="22" height="22" fill="#2563eb"/>
    <rect x="22" y="109" width="72" height="46" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="58" cy="132" r="13" fill="#16a34a"/>
    <rect x="116" y="109" width="72" height="46" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="142" y="120" width="22" height="22" fill="#eab308"/>
  </g>
  <path d="M255 167H320" class="arrow"/>
  <g transform="translate(335,112)">
    <rect width="175" height="110" rx="16" class="vision"/>
    <text x="88" y="45" text-anchor="middle" class="label">视觉编码器</text>
    <text x="88" y="73" text-anchor="middle" class="small">投影并归一化</text>
    <text x="88" y="95" text-anchor="middle" class="text">v₁ … vᵦ</text>
  </g>

  <g transform="translate(35,322)">
    <rect width="210" height="170" rx="16" class="language"/>
    <text x="105" y="31" text-anchor="middle" class="label" fill="#6d28d9">配对文本</text>
    <rect x="18" y="49" width="174" height="25" rx="6" fill="#ede9fe"/><text x="105" y="67" text-anchor="middle" class="small">红色圆形在左侧</text>
    <rect x="18" y="80" width="174" height="25" rx="6" fill="#ede9fe"/><text x="105" y="98" text-anchor="middle" class="small">蓝色方块在右侧</text>
    <rect x="18" y="111" width="174" height="25" rx="6" fill="#ede9fe"/><text x="105" y="129" text-anchor="middle" class="small">绿色圆形在左侧</text>
    <rect x="18" y="142" width="174" height="18" rx="6" fill="#ede9fe"/><text x="105" y="156" text-anchor="middle" class="small">……</text>
  </g>
  <path d="M255 407H320" class="arrow"/>
  <g transform="translate(335,352)">
    <rect width="175" height="110" rx="16" class="language"/>
    <text x="88" y="45" text-anchor="middle" class="label">语言编码器</text>
    <text x="88" y="73" text-anchor="middle" class="small">投影并归一化</text>
    <text x="88" y="95" text-anchor="middle" class="text">t₁ … tᵦ</text>
  </g>

  <path d="M520 167C575 167 585 215 615 236" class="arrow"/>
  <path d="M520 407C575 407 585 360 615 340" class="arrow"/>
  <g transform="translate(625,144)">
    <rect width="270" height="275" rx="18" class="box"/>
    <text x="135" y="34" text-anchor="middle" class="label">图文相似度矩阵 S</text>
    <g transform="translate(62,58)">
      <g fill="#dbeafe" stroke="#ffffff" stroke-width="2">
        <rect x="0" y="0" width="48" height="48"/><rect x="50" y="0" width="48" height="48"/><rect x="100" y="0" width="48" height="48"/>
        <rect x="0" y="50" width="48" height="48"/><rect x="50" y="50" width="48" height="48"/><rect x="100" y="50" width="48" height="48"/>
        <rect x="0" y="100" width="48" height="48"/><rect x="50" y="100" width="48" height="48"/><rect x="100" y="100" width="48" height="48"/>
      </g>
      <g fill="#2563eb">
        <rect x="0" y="0" width="48" height="48"/><rect x="50" y="50" width="48" height="48"/><rect x="100" y="100" width="48" height="48"/>
      </g>
      <g class="small" text-anchor="middle">
        <text x="24" y="-9">t₁</text><text x="74" y="-9">t₂</text><text x="124" y="-9">t₃</text>
        <text x="-18" y="30">v₁</text><text x="-18" y="80">v₂</text><text x="-18" y="130">v₃</text>
      </g>
      <g fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">
        <text x="24" y="30">高</text><text x="74" y="80">高</text><text x="124" y="130">高</text>
      </g>
    </g>
    <text x="135" y="226" text-anchor="middle" class="text">Sᵢⱼ = vᵢᵀtⱼ / τ</text>
    <text x="135" y="250" text-anchor="middle" class="small">行：图像找文本　列：文本找图像</text>
  </g>

  <path d="M905 282H950" class="arrow"/>
  <g transform="translate(965,210)">
    <rect width="125" height="145" rx="16" class="loss"/>
    <text x="63" y="38" text-anchor="middle" class="label">双向损失</text>
    <text x="63" y="72" text-anchor="middle" class="text">图 → 文</text>
    <text x="63" y="99" text-anchor="middle" class="text">文 → 图</text>
    <text x="63" y="127" text-anchor="middle" class="small">共同更新</text>
  </g>
  <text x="560" y="535" text-anchor="middle" class="small">对角线表示已知配对；全局图文相似并不自动给出目标像素或三维位置</text>
</svg>

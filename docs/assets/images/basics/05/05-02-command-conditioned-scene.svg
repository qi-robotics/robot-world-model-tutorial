<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">不同语言指令在同一场景中指定不同目标</title>
  <desc id="desc">同一张桌面包含红杯、蓝杯和托盘，两条指令分别突出不同的物体与目标关系。</desc>
  <defs><style>.title{font:700 20px sans-serif;fill:#172033}.text{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.dash{fill:none;stroke:#6366f1;stroke-width:3;stroke-dasharray:8 7}.arrow{stroke:#6366f1;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#6366f1"/></marker></defs>
  <rect width="1040" height="430" rx="22" fill="#fff"/><text x="40" y="44" class="title">场景相同，语言决定当前任务关注什么</text>
  <rect x="40" y="78" width="620" height="305" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="260" width="560" height="90" rx="8" fill="#d6b98b"/>
  <path d="M142 183h86v86h-86z" fill="#ef4444"/><ellipse cx="185" cy="183" rx="43" ry="14" fill="#f87171"/><path d="M228 205q48 0 27 43q-8 16-27 10" fill="none" stroke="#ef4444" stroke-width="13"/>
  <path d="M338 196h74v73h-74z" fill="#2563eb"/><ellipse cx="375" cy="196" rx="37" ry="12" fill="#60a5fa"/><path d="M412 214q42 0 24 38q-8 14-24 8" fill="none" stroke="#2563eb" stroke-width="12"/>
  <rect x="490" y="220" width="116" height="48" rx="13" fill="#f8fafc" stroke="#16a34a" stroke-width="4"/><text x="512" y="250" class="text">托盘</text>
  <rect x="120" y="157" width="140" height="129" rx="16" class="dash"/><path d="M260 150C365 80 470 100 540 210" class="arrow"/>
  <rect x="700" y="88" width="300" height="105" rx="16" class="card"/><text x="722" y="120" class="small">指令 A</text><text x="722" y="151" class="text">把红杯放到托盘上</text><text x="722" y="177" class="small">对象：红杯　目标：托盘</text>
  <rect x="700" y="221" width="300" height="105" rx="16" class="card"/><text x="722" y="253" class="small">指令 B</text><text x="722" y="284" class="text">拿起蓝杯</text><text x="722" y="310" class="small">对象：蓝杯　动作：拿起</text>
  <text x="700" y="367" class="small">语言编码 ≠ 视觉绑定</text><text x="700" y="392" class="text">Grounding 将在后续章节连接二者</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">从文字到任务表示的语言编码流程</title>
  <desc id="desc">中文指令依次经过分词、嵌入、上下文编码和带遮罩池化，产生任务向量。</desc>
  <defs>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.accent{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.token{fill:#fff;stroke:#a5b4fc;stroke-width:1.5}.muted{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.title{font:700 20px sans-serif;fill:#172033}.text{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#64748b}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1040" height="360" rx="22" fill="#fff"/>
  <text x="40" y="45" class="title">语言编码不是一步压缩，而是一条可检查的接口链</text>
  <rect x="42" y="85" width="200" height="94" rx="14" class="box"/>
  <text x="62" y="116" class="small">原始指令</text><text x="62" y="150" class="text">把红杯放到托盘上</text>
  <path d="M250 132H300" class="arrow"/>
  <rect x="310" y="73" width="276" height="118" rx="14" class="accent"/>
  <text x="330" y="103" class="small">token id · [B, L]</text>
  <rect x="330" y="122" width="48" height="38" rx="8" class="token"/><rect x="388" y="122" width="48" height="38" rx="8" class="token"/><rect x="446" y="122" width="48" height="38" rx="8" class="token"/><rect x="504" y="122" width="62" height="38" rx="8" class="muted"/>
  <text x="346" y="147" class="text">把</text><text x="402" y="147" class="text">红杯</text><text x="457" y="147" class="text">放到</text><text x="515" y="147" class="small">PAD</text>
  <path d="M596 132H646" class="arrow"/>
  <rect x="656" y="73" width="342" height="118" rx="14" class="box"/>
  <text x="676" y="103" class="small">embedding + 位置 + 上下文 · [B, L, D]</text>
  <rect x="678" y="122" width="52" height="48" rx="8" fill="#c7d2fe"/><rect x="742" y="122" width="52" height="48" rx="8" fill="#a5b4fc"/><rect x="806" y="122" width="52" height="48" rx="8" fill="#818cf8"/><rect x="870" y="122" width="52" height="48" rx="8" fill="#e2e8f0"/><rect x="934" y="122" width="42" height="48" rx="8" fill="#e2e8f0"/>
  <text x="42" y="239" class="small">mask</text><text x="98" y="239" class="text">1　1　1　1　1　0　0</text>
  <path d="M310 225H650" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/><path d="M650 225H760" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  <path d="M520 258V300H680" class="arrow"/>
  <rect x="690" y="265" width="308" height="65" rx="14" class="accent"/>
  <text x="715" y="291" class="small">masked pooling</text><text x="715" y="316" class="text">任务向量 zᵍ · [B, D]</text>
</svg>
